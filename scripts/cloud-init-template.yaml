#cloud-config

# ClawFlow VPS Bootstrap (~1.5 KB) — fits Hetzner's 32 KB user_data limit.
# All install logic lives at https://clawflow.flowmatic.co.il/install.sh
# (apps/web/public/install.sh in the repo). This file just:
#   1. Sets root password
#   2. Writes /etc/openclaw/instance.env with tenant variables
#   3. Pulls and runs install.sh
#
# Variables substituted by services/cloudInit.ts:
#   {{INSTANCE_ID}} {{SUBDOMAIN_NAME}} {{OPENCLAW_TOKEN}}
#   {{AUTOMATION_TOOL}} {{AUTOMATION_PORT}} {{AUTOMATION_PASSWORD}}
#   {{ROOT_PASSWORD}} {{MEM0_API_KEY}}
#   {{HAS_OLLAMA}} {{HAS_BACKUP}}  ← rendered as 'true'/'false' literals

chpasswd:
    list: |
        root:{{ROOT_PASSWORD}}
    expire: false

package_update: true

packages:
    - ca-certificates
    - curl

write_files:
    - path: /etc/openclaw/instance.env
      permissions: '0600'
      owner: root:root
      content: |
        INSTANCE_ID={{INSTANCE_ID}}
        SUBDOMAIN_NAME={{SUBDOMAIN_NAME}}
        OPENCLAW_TOKEN={{OPENCLAW_TOKEN}}
        AUTOMATION_TOOL={{AUTOMATION_TOOL}}
        AUTOMATION_PORT={{AUTOMATION_PORT}}
        AUTOMATION_PASSWORD={{AUTOMATION_PASSWORD}}
        MEM0_API_KEY={{MEM0_API_KEY}}
        HAS_OLLAMA={{HAS_OLLAMA}}
        HAS_BACKUP={{HAS_BACKUP}}

runcmd:
    # Pull main installer from our public CDN. Fixed URL — same content for all
    # tenants, parameterized by reading /etc/openclaw/instance.env at runtime.
    - mkdir -p /opt/openclaw
    - curl -fsSL --retry 5 --retry-delay 5 --max-time 60 https://clawflow.flowmatic.co.il/install.sh -o /opt/openclaw/install.sh
    - chmod +x /opt/openclaw/install.sh
    - /opt/openclaw/install.sh > /var/log/openclaw-install.log 2>&1 &

final_message: 'ClawFlow {{INSTANCE_ID}} bootstrap complete — install.sh running in background (~5-8 min until services ready).'
