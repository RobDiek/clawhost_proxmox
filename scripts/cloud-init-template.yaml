#cloud-config

# ClawFlow — Instance Auto-Configuration
# Variables: {{INSTANCE_ID}} {{SUBDOMAIN_NAME}} {{OPENCLAW_TOKEN}}
# {{AUTOMATION_TOOL}} {{AUTOMATION_PORT}} {{AUTOMATION_PASSWORD}}
# {{HAS_OLLAMA}} {{ROOT_PASSWORD}}

chpasswd:
    list: |
        root:{{ROOT_PASSWORD}}
    expire: false

package_update: true

packages:
    - ca-certificates
    - curl
    - gnupg
    - nginx
    - certbot
    - python3-certbot-nginx
    - ufw

runcmd:
    # ── Install Docker CE ──
    - install -m 0755 -d /etc/apt/keyrings
    - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    - chmod a+r /etc/apt/keyrings/docker.asc
    - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
    - apt-get update -qq
    - apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-compose-plugin

    # ── Install Node.js 22 ──
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y -qq nodejs

    # ── Install OpenClaw + tools ──
    - npm install -g openclaw@latest
    - apt-get install -y -qq python3-pip chromium-browser ffmpeg 2>/dev/null || true
    - snap install chromium 2>/dev/null || true
    - pip3 install --break-system-packages gcalcli google-auth google-auth-oauthlib openai-whisper 2>/dev/null || true

    # ── Firewall ──
    - ufw allow 22/tcp && ufw allow 80/tcp && ufw allow 443/tcp && ufw --force enable

    # ── Create openclaw user ──
    - useradd -r -m -d /home/openclaw -s /bin/bash openclaw

    # ── OpenClaw config ──
    - mkdir -p /home/openclaw/.openclaw
    - |
        cat > /home/openclaw/.openclaw/openclaw.json << 'OCEOF'
        {
          "gateway": {
            "mode": "local",
            "auth": { "token": "{{OPENCLAW_TOKEN}}" },
            "controlUi": {
              "allowInsecureAuth": true,
              "dangerouslyDisableDeviceAuth": true,
              "allowedOrigins": ["*"]
            },
            "trustedProxies": ["127.0.0.1", "::1"]
          },
          "agents": {
            "defaults": {
              "model": {
                "primary": "anthropic/claude-sonnet-4-6",
                "fallbacks": [
                  "anthropic/claude-haiku-4-5-20251001",
                  "openai/gpt-4o"
                ]
              },
              "models": {
                "anthropic/claude-opus-4-6": { "alias": "opus" },
                "anthropic/claude-sonnet-4-6": { "alias": "sonnet" },
                "anthropic/claude-haiku-4-5-20251001": { "alias": "haiku" },
                "openai/gpt-4o": { "alias": "gpt4o" },
                "openai/gpt-4o-mini": { "alias": "gpt4o-mini" }
              },
              "subagents": {
                "model": "anthropic/claude-haiku-4-5-20251001",
                "maxConcurrent": 1,
                "archiveAfterMinutes": 60
              },
              "bootstrapMaxChars": 10000,
              "bootstrapTotalMaxChars": 30000,
              "bootstrapPromptTruncationWarning": "always",
              "compaction": {
                "reserveTokens": 40000,
                "keepRecentTokens": 25000,
                "reserveTokensFloor": 25000
              }
            }
          },
          "openclaw-mem0": {
            "enabled": true,
            "config": {
              "mode": "open-source",
              "userId": "{{INSTANCE_ID}}",
              "autoRecall": true,
              "autoCapture": true,
              "includeAgentId": true,
              "gracefulDegradation": true,
              "maxMemories": 1000,
              "memoryTtlDays": 365,
              "customPrompt": "You are a memory extraction assistant. Extract key facts from the conversation. CRITICAL: Extract and store facts in the ORIGINAL LANGUAGE they were stated in. Hebrew stays Hebrew, English stays English. Never translate. Focus on: personal preferences, work context, communication style, recurring tasks, names, relationships, important decisions, and business information.",
              "oss": {
                "embedder": {
                  "provider": "huggingface",
                  "config": { "model": "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2" }
                },
                "vectorStore": {
                  "provider": "qdrant",
                  "config": {
                    "host": "127.0.0.1",
                    "port": 6333,
                    "collectionName": "openclaw_memories"
                  }
                },
                "llm": {
                  "provider": "anthropic",
                  "config": { "model": "claude-haiku-4-5-20251001", "temperature": 0.1 }
                }
              }
            }
          }
        }
        OCEOF
    - chown -R openclaw:openclaw /home/openclaw
    - chmod 600 /home/openclaw/.openclaw/openclaw.json

    # ── OpenClaw systemd service ──
    - |
        cat > /etc/systemd/system/openclaw-gateway.service << 'SVCEOF'
        [Unit]
        Description=OpenClaw Gateway
        After=network.target

        [Service]
        Type=simple
        User=openclaw
        Group=openclaw
        WorkingDirectory=/home/openclaw
        Environment=HOME=/home/openclaw
        Environment=NODE_ENV=production
        Environment=OPENCLAW_GATEWAY_TOKEN={{OPENCLAW_TOKEN}}
        ExecStart=/usr/bin/openclaw gateway run --port 3000 --bind loopback --auth token
        Restart=always
        RestartSec=10

        [Install]
        WantedBy=multi-user.target
        SVCEOF

    - systemctl daemon-reload
    - systemctl enable openclaw-gateway
    - systemctl start openclaw-gateway

    # ── Pair CLI device with Gateway ──
    # Required for openclaw CLI commands (channels add, cron add, etc.)
    - sleep 5
    - |
        su - openclaw -c '
        # Set gateway port in config
        openclaw config set gateway.port 3000 2>/dev/null

        # Trigger device identity creation by attempting a connection
        openclaw cron list 2>/dev/null || true
        sleep 2

        # Read device identity and write it as paired
        DEVICE_ID=$(node -e "try{const d=require(process.env.HOME+\"/.openclaw/identity/device.json\");console.log(d.deviceId)}catch(e){}" 2>/dev/null)

        if [ -n "$DEVICE_ID" ]; then
            # Read the pending request to get the correct publicKey format
            PUB_KEY=$(node -e "try{const p=require(process.env.HOME+\"/.openclaw/devices/pending.json\");const k=Object.values(p)[0];if(k)console.log(k.publicKey)}catch(e){}" 2>/dev/null)

            if [ -n "$PUB_KEY" ]; then
                mkdir -p ~/.openclaw/devices
                cat > ~/.openclaw/devices/paired.json << EOFPAIR
        {
          "$DEVICE_ID": {
            "deviceId": "$DEVICE_ID",
            "publicKey": "$PUB_KEY",
            "platform": "linux",
            "clientId": "cli",
            "clientMode": "cli",
            "role": "operator",
            "roles": ["operator"],
            "scopes": ["operator.admin","operator.read","operator.write","operator.approvals","operator.pairing"],
            "pairedAtMs": $(date +%s)000,
            "label": "local-cli"
          }
        }
        EOFPAIR
                echo "{}" > ~/.openclaw/devices/pending.json
            fi
        fi
        '
    # Restart gateway to pick up pairing
    - systemctl restart openclaw-gateway
    - sleep 3

    # ── Install Mem0 plugin (after gateway is running + paired) ──
    - |
        su - openclaw -c '
          openclaw plugins install @mem0/openclaw-mem0 2>/dev/null || true
        '
    # Restart gateway to load plugin
    - systemctl restart openclaw-gateway
    - sleep 2

    # ── Automation Tool (Docker) ──
    {{#IS_N8N}}
    - mkdir -p /opt/openclaw/data/n8n
    - |
        cat > /opt/openclaw/docker-compose.yml << 'DCEOF'
        services:
          n8n:
            image: n8nio/n8n:latest
            restart: unless-stopped
            ports: ["127.0.0.1:5678:5678"]
            volumes: ["/opt/openclaw/data/n8n:/home/node/.n8n"]
            environment:
              - N8N_HOST={{SUBDOMAIN_NAME}}-flows.clawflow.flowmatic.co.il
              - N8N_PROTOCOL=https
              - N8N_PORT=5678
              - WEBHOOK_URL=https://{{SUBDOMAIN_NAME}}-flows.clawflow.flowmatic.co.il
              - N8N_ENCRYPTION_KEY={{AUTOMATION_PASSWORD}}
              - N8N_USER_MANAGEMENT_DISABLED=true
              - N8N_DIAGNOSTICS_ENABLED=false
              - N8N_PERSONALIZATION_ENABLED=false
              - N8N_TEMPLATES_ENABLED=true
        DCEOF
    {{/IS_N8N}}
    {{#IS_ACTIVEPIECES}}
    - mkdir -p /opt/openclaw/data/{ap-db,ap-redis}
    - |
        cat > /opt/openclaw/docker-compose.yml << 'DCEOF'
        services:
          activepieces:
            image: activepieces/activepieces:latest
            restart: unless-stopped
            ports: ["127.0.0.1:8080:80"]
            depends_on: [ap-postgres, ap-redis]
            environment:
              - AP_ENGINE_EXECUTABLE_PATH=dist/packages/engine/main.js
              - AP_POSTGRES_DATABASE=activepieces
              - AP_POSTGRES_HOST=ap-postgres
              - AP_POSTGRES_PORT=5432
              - AP_POSTGRES_USERNAME=activepieces
              - AP_POSTGRES_PASSWORD={{AUTOMATION_PASSWORD}}
              - AP_REDIS_HOST=ap-redis
              - AP_REDIS_PORT=6379
              - AP_FRONTEND_URL=https://{{SUBDOMAIN_NAME}}-flows.clawflow.flowmatic.co.il
              - AP_ENCRYPTION_KEY={{OPENCLAW_TOKEN}}
              - AP_JWT_SECRET={{AUTOMATION_PASSWORD}}
              - AP_EDITION=ce
              - AP_SIGN_UP_ENABLED=false
              - AP_TELEMETRY_ENABLED=false
          ap-postgres:
            image: postgres:16-alpine
            restart: unless-stopped
            environment:
              POSTGRES_DB: activepieces
              POSTGRES_USER: activepieces
              POSTGRES_PASSWORD: {{AUTOMATION_PASSWORD}}
            volumes: ["/opt/openclaw/data/ap-db:/var/lib/postgresql/data"]
          ap-redis:
            image: redis:7-alpine
            restart: unless-stopped
            volumes: ["/opt/openclaw/data/ap-redis:/data"]
        DCEOF
    {{/IS_ACTIVEPIECES}}

    - chown -R 1000:1000 /opt/openclaw/data/n8n 2>/dev/null || true
    - cd /opt/openclaw && docker compose up -d

    # ── Mem0 Memory Layer (Qdrant vector store + OpenClaw plugin) ──
    - mkdir -p /opt/openclaw/data/qdrant
    - |
        # Separate compose file for Qdrant — avoids YAML injection issues
        cat > /opt/openclaw/docker-compose.qdrant.yml << 'QDEOF'
        services:
          qdrant:
            image: qdrant/qdrant:latest
            restart: unless-stopped
            ports: ["127.0.0.1:6333:6333"]
            volumes: ["/opt/openclaw/data/qdrant:/qdrant/storage"]
        QDEOF
    - cd /opt/openclaw && docker compose -f docker-compose.yml -f docker-compose.qdrant.yml up -d qdrant

    {{#HAS_OLLAMA}}
    # ── Ollama ──
    - curl -fsSL https://ollama.com/install.sh | sh
    - systemctl enable ollama
    - systemctl start ollama
    - |
        for i in $(seq 1 12); do
          ollama list 2>/dev/null && break
          sleep 5
        done
        ollama pull llama3.1:8b
        ollama pull nomic-embed-text
    # Configure Ollama provider via skills config (safe — doesn't touch openclaw.json)
    - |
        mkdir -p /home/openclaw/.openclaw/skills-config
        echo '{"provider":"ollama","baseUrl":"http://localhost:11434","defaultModel":"llama3.1:8b"}' > /home/openclaw/.openclaw/skills-config/ollama.json
        chown -R openclaw:openclaw /home/openclaw/.openclaw/skills-config
    # Switch Mem0 embedder to local Ollama (free, no external API costs)
    - |
        OCJSON="/home/openclaw/.openclaw/openclaw.json"
        node -e "
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('$OCJSON','utf-8'));
          if (c['openclaw-mem0']?.config?.oss) {
            c['openclaw-mem0'].config.oss.embedder = {
              provider: 'ollama',
              config: { model: 'nomic-embed-text', ollama_base_url: 'http://127.0.0.1:11434' }
            };
            fs.writeFileSync('$OCJSON', JSON.stringify(c, null, 2));
          }
        " 2>/dev/null || true
        chown openclaw:openclaw "$OCJSON"
    # Restart gateway to pick up Ollama embedder config
    - systemctl restart openclaw-gateway
    {{/HAS_OLLAMA}}

    # ── Nginx ──
    - |
        cat > /etc/nginx/sites-available/openclaw << 'NGEOF'
        server {
            listen 80;
            server_name {{SUBDOMAIN_NAME}}.clawflow.flowmatic.co.il;

            location / {
                proxy_pass http://127.0.0.1:3000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 300s;
                proxy_hide_header X-Frame-Options;
                proxy_hide_header Content-Security-Policy;
            }

            location = /embed {
                proxy_pass http://127.0.0.1:3000/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 300s;
                proxy_hide_header X-Frame-Options;
                proxy_hide_header Content-Security-Policy;
            }

            location /embed/ {
                proxy_pass http://127.0.0.1:3000/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 300s;
                proxy_hide_header X-Frame-Options;
                proxy_hide_header Content-Security-Policy;
                sub_filter '</head>' '<style>.shell-nav,.shell-nav-backdrop,.agents-sidebar,.topnav-shell,.agent-header,.agents-toolbar,.agent-chat__toolbar,.agent-chat__toolbar-left,.agent-chat__toolbar-right,.chat-controls__model,.chat-controls__session,.chat-controls__session-row,.agent-model-select{display:none!important}.shell{grid-template-columns:1fr!important}</style></head>';
                sub_filter_once on;
                sub_filter_types text/html;
            }
        }
        server {
            listen 80;
            server_name {{SUBDOMAIN_NAME}}-flows.clawflow.flowmatic.co.il;

            # Block Platform Admin — customers don't need it
            location /platform {
                return 404;
            }

            location / {
                proxy_pass http://127.0.0.1:8080;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
        NGEOF

    - ln -sf /etc/nginx/sites-available/openclaw /etc/nginx/sites-enabled/
    - rm -f /etc/nginx/sites-enabled/default
    - grep -q server_names_hash /etc/nginx/nginx.conf || sed -i '/http {/a\    server_names_hash_bucket_size 128;' /etc/nginx/nginx.conf
    - nginx -t && systemctl enable nginx && systemctl restart nginx

    # ── SSL ──
    - |
        for i in $(seq 1 30); do
          certbot --nginx \
            -d {{SUBDOMAIN_NAME}}.clawflow.flowmatic.co.il \
            -d {{SUBDOMAIN_NAME}}-flows.clawflow.flowmatic.co.il \
            --non-interactive --agree-tos \
            -m devops@flowmatic.co.il && break
          sleep 15
        done

    {{#HAS_BACKUP}}
    # ── Daily Backup ──
    - mkdir -p /opt/openclaw-backups
    - |
        cat > /opt/openclaw-backup.sh << 'BKEOF'
        #!/bin/bash
        BACKUP_DIR="/opt/openclaw-backups"
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        BACKUP_FILE="$BACKUP_DIR/backup-$TIMESTAMP.tar.gz"
        INSTANCE_ID="{{INSTANCE_ID}}"
        API_URL="https://api.clawflow.flowmatic.co.il"

        # Create backup of openclaw data + automation configs
        tar -czf "$BACKUP_FILE" \
          -C /home/openclaw .openclaw \
          -C /opt/openclaw data 2>/dev/null

        # Keep only last 7 days
        find "$BACKUP_DIR" -name "backup-*.tar.gz" -mtime +7 -delete

        # Report to API
        BACKUP_SIZE=$(stat -f%z "$BACKUP_FILE" 2>/dev/null || stat -c%s "$BACKUP_FILE" 2>/dev/null || echo "0")
        BACKUP_COUNT=$(ls -1 "$BACKUP_DIR"/backup-*.tar.gz 2>/dev/null | wc -l)
        curl -sf -X POST "$API_URL/hosting/instances/$INSTANCE_ID/backup-report" \
          -H "Content-Type: application/json" \
          -d "{\"timestamp\":\"$TIMESTAMP\",\"size\":$BACKUP_SIZE,\"count\":$BACKUP_COUNT}" > /dev/null || true
        BKEOF
    - chmod +x /opt/openclaw-backup.sh
    - echo "0 3 * * * root /opt/openclaw-backup.sh >> /var/log/openclaw-backup.log 2>&1" > /etc/cron.d/openclaw-backup
    # Run first backup immediately
    - /opt/openclaw-backup.sh &
    {{/HAS_BACKUP}}

    # ── Self-Healing Health Daemon ──
    # Script is deployed by provisioner via SSH after VPS is ready (not cloud-init)
    # This only sets up the systemd timer structure
    - |
        cat > /etc/systemd/system/clawflow-health.service << 'CHSEOF'
        [Unit]
        Description=ClawFlow Self-Healing Health Check
        After=openclaw-gateway.service docker.service
        [Service]
        Type=oneshot
        ExecStart=/opt/clawflow-health.sh
        TimeoutSec=120
        CHSEOF
        cat > /etc/systemd/system/clawflow-health.timer << 'CHTEOF'
        [Unit]
        Description=ClawFlow Health Check Timer (every 5 min)
        [Timer]
        OnBootSec=300
        OnUnitActiveSec=300
        [Install]
        WantedBy=timers.target
        CHTEOF
    - systemctl daemon-reload

    # ── OpenClaw auto-update (nightly 4am, silent) ──
    - |
        cat > /opt/openclaw-update.sh << 'UPDEOF'
        #!/bin/bash
        # Silent OpenClaw Gateway update
        CURRENT=$(su - openclaw -c 'openclaw --version 2>/dev/null' || echo "unknown")
        npm install -g @anthropic/openclaw@latest --silent 2>/dev/null
        NEW=$(su - openclaw -c 'openclaw --version 2>/dev/null' || echo "unknown")
        if [ "$CURRENT" != "$NEW" ]; then
          systemctl restart openclaw-gateway
          echo "$(date): Updated OpenClaw $CURRENT -> $NEW" >> /var/log/openclaw-update.log
        fi
        UPDEOF
        chmod +x /opt/openclaw-update.sh
    - echo "0 4 * * * root /opt/openclaw-update.sh >> /var/log/openclaw-update.log 2>&1" > /etc/cron.d/openclaw-update

    # Note: OpenClaw update banner cannot be disabled via config.
    # Auto-update cron (above) handles updates silently at 4am.

final_message: 'ClawFlow instance {{INSTANCE_ID}} ready!'
