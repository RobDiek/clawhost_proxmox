#cloud-config

# ClawFlow — Instance Auto-Configuration
# Variables: {{INSTANCE_ID}} {{SUBDOMAIN_NAME}} {{OPENCLAW_TOKEN}}
# {{AUTOMATION_TOOL}} {{AUTOMATION_PORT}} {{AUTOMATION_PASSWORD}}
# {{HAS_OLLAMA}} {{ROOT_PASSWORD}}

chpasswd:
    list: |
        root:{{ROOT_PASSWORD}}
    expire: false

package_update: true

packages:
    - ca-certificates
    - curl
    - gnupg
    - nginx
    - certbot
    - python3-certbot-nginx
    - ufw

runcmd:
    # ── Install Docker CE ──
    - install -m 0755 -d /etc/apt/keyrings
    - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    - chmod a+r /etc/apt/keyrings/docker.asc
    - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
    - apt-get update -qq
    - apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-compose-plugin

    # ── Install Node.js 22 ──
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y -qq nodejs

    # ── Install OpenClaw + tools ──
    - npm install -g openclaw@latest
    - apt-get install -y -qq python3-pip chromium-browser ffmpeg 2>/dev/null || true
    - snap install chromium 2>/dev/null || true
    - pip3 install --break-system-packages openai-whisper 2>/dev/null || true
    # Pre-download whisper base model (139MB, not large-v3-turbo 1.6GB — OOM on small VPS)
    - su - openclaw -c "python3 -c \"import whisper; whisper.load_model('base')\"" 2>/dev/null || true
    # Create 2GB swap (prevents OOM kills on 4GB VPS)
    - |
        if [ ! -f /swapfile ]; then
            fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
            echo "/swapfile none swap sw 0 0" >> /etc/fstab
        fi
    - pip3 install --break-system-packages crawl4ai 2>/dev/null || true
    - pip3 install --break-system-packages llm-guard 2>/dev/null || true
    - pip3 install --break-system-packages crewai crewai-tools 2>/dev/null || true
    # Crawl4AI post-install: download browser if needed
    - python3 -c "from crawl4ai import AsyncWebCrawler" 2>/dev/null || true

    # ── LLM Guard scanner script ──
    - |
        cat > /opt/openclaw/llm-guard-scan.py << 'LGEOF'
        #!/usr/bin/env python3
        """LLM Guard scanner — validates input/output for AI agents.
        Usage: echo '{"text":"...","direction":"input"}' | python3 llm-guard-scan.py
        Returns: {"safe":true/false,"score":0.0-1.0,"flagged":[],"sanitized":"..."}
        """
        import sys, json

        def scan_input(text):
            try:
                from llm_guard.input_scanners import PromptInjection, TokenLimit, Toxicity
                from llm_guard.input_scanners.prompt_injection import MatchType

                scanners = [
                    PromptInjection(threshold=0.7, match_type=MatchType.FULL),
                    TokenLimit(limit=8000),
                    Toxicity(threshold=0.7),
                ]

                flagged = []
                sanitized = text
                max_score = 0.0

                for scanner in scanners:
                    sanitized, is_valid, risk_score = scanner.scan("", sanitized)
                    if not is_valid:
                        flagged.append(scanner.__class__.__name__)
                    max_score = max(max_score, risk_score)

                return {
                    "safe": len(flagged) == 0,
                    "score": round(max_score, 3),
                    "flagged": flagged,
                    "sanitized": sanitized[:10000]
                }
            except ImportError:
                return {"safe": True, "score": 0, "flagged": [], "sanitized": text, "error": "llm-guard not installed"}
            except Exception as e:
                return {"safe": True, "score": 0, "flagged": [], "sanitized": text, "error": str(e)}

        def scan_output(text):
            try:
                from llm_guard.output_scanners import NoRefusal, Relevance, Sensitive

                scanners = [
                    NoRefusal(threshold=0.5),
                    Sensitive(threshold=0.5),
                ]

                flagged = []
                sanitized = text
                max_score = 0.0

                for scanner in scanners:
                    sanitized, is_valid, risk_score = scanner.scan("", sanitized)
                    if not is_valid:
                        flagged.append(scanner.__class__.__name__)
                    max_score = max(max_score, risk_score)

                return {
                    "safe": len(flagged) == 0,
                    "score": round(max_score, 3),
                    "flagged": flagged,
                    "sanitized": sanitized[:10000]
                }
            except ImportError:
                return {"safe": True, "score": 0, "flagged": [], "sanitized": text, "error": "llm-guard not installed"}
            except Exception as e:
                return {"safe": True, "score": 0, "flagged": [], "sanitized": text, "error": str(e)}

        if __name__ == "__main__":
            data = json.loads(sys.stdin.read())
            text = data.get("text", "")
            direction = data.get("direction", "input")

            if direction == "output":
                result = scan_output(text)
            else:
                result = scan_input(text)

            print(json.dumps(result))
        LGEOF
    - chmod +x /opt/openclaw/llm-guard-scan.py

    # ── Pre-cache MCP server packages (speeds up first connection) ──
    - |
        npm install -g \
          @brave/brave-search-mcp-server \
          @mem0/mcp-server \
          @respira/wordpress-mcp-server \
          @gongrzhe/image-gen-server \
          mcp-mail-server \
          mcp-communicator-telegram \
          @mcpware/instagram-mcp \
          dataforseo-mcp-server \
          firecrawl-mcp \
          2>/dev/null || true

    # ── ms365-lite MCP server deployed by provisioner after cloud-init completes ──
    # Lightweight alternative to @softeria/ms-365-mcp-server (12 tools vs 120+)
    # Deployed via SSH from provisioner.ts when Microsoft is connected

    # ── Firewall ──
    - ufw allow 22/tcp && ufw allow 80/tcp && ufw allow 443/tcp && ufw --force enable

    # ── Create openclaw user ──
    - useradd -r -m -d /home/openclaw -s /bin/bash openclaw

    # ── OpenClaw config ──
    - mkdir -p /home/openclaw/.openclaw
    - |
        cat > /home/openclaw/.openclaw/openclaw.json << 'OCEOF'
        {
          "gateway": {
            "mode": "local",
            "auth": { "token": "{{OPENCLAW_TOKEN}}" },
            "controlUi": {
              "allowInsecureAuth": true,
              "dangerouslyDisableDeviceAuth": true,
              "allowedOrigins": ["*"]
            },
            "trustedProxies": ["127.0.0.1", "::1"]
          },
          "agents": {
            "defaults": {
              "model": {
                "primary": "anthropic/claude-haiku-4-5-20251001",
                "fallbacks": [
                  "anthropic/claude-sonnet-4-6",
                  "openai/gpt-4o-mini"
                ]
              },
              "models": {
                "anthropic/claude-opus-4-6": { "alias": "opus" },
                "anthropic/claude-sonnet-4-6": { "alias": "sonnet" },
                "anthropic/claude-haiku-4-5-20251001": { "alias": "haiku" },
                "openai/gpt-4o": { "alias": "gpt4o" },
                "openai/gpt-4o-mini": { "alias": "gpt4o-mini" }
              },
              "subagents": {
                "model": "anthropic/claude-haiku-4-5-20251001",
                "maxConcurrent": 2,
                "archiveAfterMinutes": 60
              },
              "bootstrapMaxChars": 10000,
              "bootstrapTotalMaxChars": 30000,
              "bootstrapPromptTruncationWarning": "always",
              "heartbeat": {
                "every": "4h",
                "model": "anthropic/claude-haiku-4-5-20251001",
                "lightContext": true,
                "activeHours": {
                  "start": "06:00",
                  "end": "23:00",
                  "timezone": "Asia/Jerusalem"
                }
              },
              "compaction": {
                "reserveTokens": 40000,
                "keepRecentTokens": 25000,
                "reserveTokensFloor": 25000
              }
            }
          },
          "plugins": {
            "allow": ["anthropic", "openai", "telegram", "browser"],
            "entries": {
              "anthropic": { "enabled": true },
              "openai": { "enabled": true },
              "telegram": { "enabled": true },
              "browser": { "enabled": true }
            }
          }
        }
        OCEOF
    - chown -R openclaw:openclaw /home/openclaw
    - chmod 600 /home/openclaw/.openclaw/openclaw.json

    # ── CLAUDE.md — system instructions for all models ──
    - |
        cat > /home/openclaw/.openclaw/workspace/CLAUDE.md << 'CLEOF'
        # System Instructions

        ## CRITICAL: First Run Check

        At the START of EVERY session, before responding to any message:

        1. Check if `BOOTSTRAP.md` exists in this workspace
        2. If it exists → follow it IMMEDIATELY. This is your onboarding. Ask who the user is, figure out your name and identity, update IDENTITY.md and USER.md. Delete BOOTSTRAP.md when done.
        3. If it does NOT exist → read SOUL.md, USER.md, IDENTITY.md, and AGENTS.md

        **NEVER skip this check. NEVER respond without reading workspace files first.**

        ## Workspace Files

        - `AGENTS.md` — your full operating manual
        - `SOUL.md` — your personality and values
        - `USER.md` — who you are helping
        - `IDENTITY.md` — your name, vibe, emoji
        - `BOOTSTRAP.md` — onboarding (only exists before first setup)
        - `memory/` — daily notes and long-term memory

        ## Language

        Default: Hebrew (עברית). Respond in the language the user writes in.

        ## Rules

        - Read workspace files before answering
        - Write important things to files (memory is ephemeral, files persist)
        - Never share private data in group chats
        - Ask before taking destructive or external actions
        CLEOF
    - chown openclaw:openclaw /home/openclaw/.openclaw/workspace/CLAUDE.md

    # ── OpenClaw systemd service ──
    - |
        cat > /etc/systemd/system/openclaw-gateway.service << 'SVCEOF'
        [Unit]
        Description=OpenClaw Gateway
        After=network.target

        [Service]
        Type=simple
        User=openclaw
        Group=openclaw
        WorkingDirectory=/home/openclaw
        Environment=HOME=/home/openclaw
        Environment=NODE_ENV=production
        Environment=OPENCLAW_GATEWAY_TOKEN={{OPENCLAW_TOKEN}}
        ExecStart=/usr/bin/openclaw gateway run --port 3000 --bind loopback --auth token
        Restart=always
        RestartSec=10

        [Install]
        WantedBy=multi-user.target
        SVCEOF

    - systemctl daemon-reload
    - systemctl enable openclaw-gateway
    - systemctl start openclaw-gateway

    # ── Pair CLI device with Gateway ──
    # Required for openclaw CLI commands (channels add, cron add, etc.)
    - sleep 5
    - |
        su - openclaw -c '
        # Set gateway port in config
        openclaw config set gateway.port 3000 2>/dev/null

        # Trigger device identity creation by attempting a connection
        openclaw cron list 2>/dev/null || true
        sleep 2

        # Read device identity and write it as paired
        DEVICE_ID=$(node -e "try{const d=require(process.env.HOME+\"/.openclaw/identity/device.json\");console.log(d.deviceId)}catch(e){}" 2>/dev/null)

        if [ -n "$DEVICE_ID" ]; then
            # Read the pending request to get the correct publicKey format
            PUB_KEY=$(node -e "try{const p=require(process.env.HOME+\"/.openclaw/devices/pending.json\");const k=Object.values(p)[0];if(k)console.log(k.publicKey)}catch(e){}" 2>/dev/null)

            if [ -n "$PUB_KEY" ]; then
                mkdir -p ~/.openclaw/devices
                cat > ~/.openclaw/devices/paired.json << EOFPAIR
        {
          "$DEVICE_ID": {
            "deviceId": "$DEVICE_ID",
            "publicKey": "$PUB_KEY",
            "platform": "linux",
            "clientId": "cli",
            "clientMode": "cli",
            "role": "operator",
            "roles": ["operator"],
            "scopes": ["operator.admin","operator.read","operator.write","operator.approvals","operator.pairing"],
            "pairedAtMs": $(date +%s)000,
            "label": "local-cli"
          }
        }
        EOFPAIR
                echo "{}" > ~/.openclaw/devices/pending.json
            fi
        fi
        '
    # Restart gateway to pick up pairing
    - systemctl restart openclaw-gateway
    - sleep 3

    # ── Install & configure Mem0 plugin (Platform mode — master API key) ──
    - |
        su - openclaw -c 'openclaw plugins install @mem0/openclaw-mem0 2>/dev/null || true'
        su - openclaw -c 'openclaw plugins enable openclaw-mem0 2>/dev/null || true'
        # Configure Mem0 Platform mode (gateway must be stopped)
        systemctl stop openclaw-gateway 2>/dev/null
        python3 -c "
import json
p = '/home/openclaw/.openclaw/openclaw.json'
with open(p) as f:
    cfg = json.load(f)
plugins = cfg.setdefault('plugins', {})
entries = plugins.setdefault('entries', {})
entries['openclaw-mem0'] = {
    'enabled': True,
    'config': {
        'mode': 'platform',
        'apiKey': '{{MEM0_API_KEY}}',
        'userId': '{{INSTANCE_ID}}',
        'autoCapture': True,
        'autoRecall': True,
        'searchThreshold': 0.4,
        'topK': 5,
        'customInstructions': 'Store important facts about the user, business, preferences, decisions. Store in Hebrew when original is Hebrew. Never store API keys or passwords.'
    }
}
entries.setdefault('memory-core', {})['enabled'] = False
plugins.setdefault('slots', {})['memory'] = 'openclaw-mem0'
plugins['allow'] = list(entries.keys())
cfg['plugins'] = plugins
with open(p, 'w') as f:
    json.dump(cfg, f, indent=2)
print('Mem0 Platform configured')
"
        # Patch plugin to tolerate anonymousTelemetryId (OpenClaw framework adds it)
        PLUGIN_JS=/home/openclaw/.openclaw/extensions/openclaw-mem0/dist/index.js
        if [ -f "$PLUGIN_JS" ]; then
          python3 -c "
with open('$PLUGIN_JS') as f:
    code = f.read()
old = 'const unknown = Object.keys(value).filter((key) => !allowed.includes(key));'
new = 'const unknown = Object.keys(value).filter((key) => !allowed.includes(key) && key !== \"anonymousTelemetryId\");'
if old in code:
    with open('$PLUGIN_JS', 'w') as f:
        f.write(code.replace(old, new, 1))
"
        fi
        # Add MEM0_API_KEY to gateway service env
        if ! grep -q MEM0_API_KEY /etc/systemd/system/openclaw-gateway.service; then
          sed -i '/\[Service\]/a Environment=MEM0_API_KEY={{MEM0_API_KEY}}' /etc/systemd/system/openclaw-gateway.service
          systemctl daemon-reload
        fi
        chown -R openclaw:openclaw /home/openclaw/.openclaw
        systemctl start openclaw-gateway

    # ── Automation Tool (Docker) — Activepieces (MIT license) ──
    {{#IS_ACTIVEPIECES}}
    - mkdir -p /opt/openclaw/data/{ap-db,ap-redis}
    - |
        cat > /opt/openclaw/docker-compose.yml << 'DCEOF'
        services:
          activepieces:
            image: activepieces/activepieces:latest
            restart: unless-stopped
            ports: ["127.0.0.1:8080:80"]
            depends_on: [ap-postgres, ap-redis]
            environment:
              - AP_ENGINE_EXECUTABLE_PATH=dist/packages/engine/main.js
              - AP_POSTGRES_DATABASE=activepieces
              - AP_POSTGRES_HOST=ap-postgres
              - AP_POSTGRES_PORT=5432
              - AP_POSTGRES_USERNAME=activepieces
              - AP_POSTGRES_PASSWORD={{AUTOMATION_PASSWORD}}
              - AP_REDIS_HOST=ap-redis
              - AP_REDIS_PORT=6379
              - AP_FRONTEND_URL=https://{{SUBDOMAIN_NAME}}-flows.clawflow.flowmatic.co.il
              - AP_ENCRYPTION_KEY={{OPENCLAW_TOKEN}}
              - AP_JWT_SECRET={{AUTOMATION_PASSWORD}}
              - AP_EDITION=ce
              - AP_SIGN_UP_ENABLED=false
              - AP_TELEMETRY_ENABLED=false
          ap-postgres:
            image: postgres:16-alpine
            restart: unless-stopped
            environment:
              POSTGRES_DB: activepieces
              POSTGRES_USER: activepieces
              POSTGRES_PASSWORD: {{AUTOMATION_PASSWORD}}
            volumes: ["/opt/openclaw/data/ap-db:/var/lib/postgresql/data"]
          ap-redis:
            image: redis:7.2-alpine
            restart: unless-stopped
            volumes: ["/opt/openclaw/data/ap-redis:/data"]
        DCEOF
    {{/IS_ACTIVEPIECES}}

    # Dify removed — Modified Apache 2.0 license prohibits multi-tenant SaaS
    # n8n removed — Sustainable Use License prohibits managed hosting
    - cd /opt/openclaw && docker compose up -d

    # ── Mem0 Memory Layer (Qdrant vector store + OpenClaw plugin) ──
    - mkdir -p /opt/openclaw/data/qdrant
    - |
        # Separate compose file for Qdrant — avoids YAML injection issues
        cat > /opt/openclaw/docker-compose.qdrant.yml << 'QDEOF'
        services:
          qdrant:
            image: qdrant/qdrant:latest
            restart: unless-stopped
            ports: ["127.0.0.1:6333:6333"]
            volumes: ["/opt/openclaw/data/qdrant:/qdrant/storage"]
        QDEOF
    - cd /opt/openclaw && docker compose -f docker-compose.yml -f docker-compose.qdrant.yml up -d qdrant

    # Twenty CRM removed — AGPLv3 copyleft license risk for managed hosting

    {{#HAS_OLLAMA}}
    # ── Ollama ──
    - curl -fsSL https://ollama.com/install.sh | sh
    - systemctl enable ollama
    - systemctl start ollama
    - |
        for i in $(seq 1 12); do
          ollama list 2>/dev/null && break
          sleep 5
        done
        ollama pull llama3.1:8b
        ollama pull nomic-embed-text
    # Configure Ollama provider via skills config (safe — doesn't touch openclaw.json)
    - |
        mkdir -p /home/openclaw/.openclaw/skills-config
        echo '{"provider":"ollama","baseUrl":"http://localhost:11434","defaultModel":"llama3.1:8b"}' > /home/openclaw/.openclaw/skills-config/ollama.json
        chown -R openclaw:openclaw /home/openclaw/.openclaw/skills-config
    # Switch Mem0 embedder to local Ollama (free, no external API costs)
    - |
        OCJSON="/home/openclaw/.openclaw/openclaw.json"
        node -e "
          echo 'Ollama ready'
        " 2>/dev/null || true
    {{/HAS_OLLAMA}}

    # ── Langfuse LLM Observability ──
    - mkdir -p /opt/openclaw/data/{langfuse-db,langfuse-clickhouse}
    - |
        cat > /opt/openclaw/docker-compose.langfuse.yml << 'LFEOF'
        services:
          langfuse:
            image: langfuse/langfuse:latest
            restart: unless-stopped
            ports: ["127.0.0.1:3200:3000"]
            depends_on: [langfuse-postgres]
            environment:
              - DATABASE_URL=postgresql://langfuse:{{AUTOMATION_PASSWORD}}@langfuse-postgres:5432/langfuse
              - NEXTAUTH_URL=https://{{SUBDOMAIN_NAME}}-obs.clawflow.flowmatic.co.il
              - NEXTAUTH_SECRET={{OPENCLAW_TOKEN}}
              - SALT={{AUTOMATION_PASSWORD}}
              - TELEMETRY_ENABLED=false
              - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=false
              - LANGFUSE_DEFAULT_PROJECT_ID={{INSTANCE_ID}}
              - LANGFUSE_INIT_ORG_ID={{INSTANCE_ID}}
              - LANGFUSE_INIT_ORG_NAME=OpenClaw
              - LANGFUSE_INIT_PROJECT_ID={{INSTANCE_ID}}
              - LANGFUSE_INIT_PROJECT_NAME=AI Agents
              - LANGFUSE_INIT_PROJECT_PUBLIC_KEY=pk-{{INSTANCE_ID}}
              - LANGFUSE_INIT_PROJECT_SECRET_KEY={{OPENCLAW_TOKEN}}
              - LANGFUSE_INIT_USER_EMAIL=admin@openclaw.local
              - LANGFUSE_INIT_USER_PASSWORD={{AUTOMATION_PASSWORD}}
              - LANGFUSE_INIT_USER_NAME=Admin
          langfuse-postgres:
            image: postgres:16-alpine
            restart: unless-stopped
            environment:
              POSTGRES_DB: langfuse
              POSTGRES_USER: langfuse
              POSTGRES_PASSWORD: {{AUTOMATION_PASSWORD}}
            volumes: ["/opt/openclaw/data/langfuse-db:/var/lib/postgresql/data"]
        LFEOF
    - cd /opt/openclaw && docker compose -f docker-compose.yml -f docker-compose.qdrant.yml -f docker-compose.langfuse.yml up -d langfuse langfuse-postgres

    # ── Neo4j Community (temporal knowledge graph for marketing facts) ──
    # Used by openclaw-facts MCP plugin to store/query entities (competitors,
    # personas, keywords, channels, customers) + timestamped relationships.
    # Reduces token usage — agents query structured facts instead of re-reading
    # STRATEGY.md / BRAND.md every task.
    # License: GPLv3 — OK when used as separate DB via Bolt protocol (not modifying/embedding).
    - mkdir -p /opt/openclaw/data/neo4j/{data,logs,import,plugins}
    - |
        cat > /opt/openclaw/docker-compose.neo4j.yml << 'NEO4JEOF'
        services:
          neo4j:
            image: neo4j:5-community
            restart: unless-stopped
            ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
            environment:
              - NEO4J_AUTH=neo4j/{{AUTOMATION_PASSWORD}}
              - NEO4J_server_memory_heap_initial__size=512m
              - NEO4J_server_memory_heap_max__size=1g
              - NEO4J_server_memory_pagecache_size=512m
              - NEO4J_db_tx__log_rotation_retention__policy=100M size
            volumes:
              - /opt/openclaw/data/neo4j/data:/data
              - /opt/openclaw/data/neo4j/logs:/logs
              - /opt/openclaw/data/neo4j/import:/var/lib/neo4j/import
              - /opt/openclaw/data/neo4j/plugins:/plugins
            healthcheck:
              test: ["CMD-SHELL", "cypher-shell -u neo4j -p '{{AUTOMATION_PASSWORD}}' 'RETURN 1' || exit 1"]
              interval: 30s
              timeout: 10s
              retries: 5
        NEO4JEOF
    - cd /opt/openclaw && docker compose -f docker-compose.yml -f docker-compose.qdrant.yml -f docker-compose.langfuse.yml -f docker-compose.neo4j.yml up -d neo4j

    # Wait for Neo4j + seed initial schema (constraints + indexes)
    - |
        for i in $(seq 1 24); do
          if docker exec openclaw-neo4j-1 cypher-shell -u neo4j -p '{{AUTOMATION_PASSWORD}}' 'RETURN 1' 2>/dev/null; then
            echo "Neo4j ready after $i attempts"; break
          fi
          sleep 5
        done
        docker exec openclaw-neo4j-1 cypher-shell -u neo4j -p '{{AUTOMATION_PASSWORD}}' "
          CREATE CONSTRAINT entity_id IF NOT EXISTS FOR (e:Entity) REQUIRE e.id IS UNIQUE;
          CREATE INDEX entity_type IF NOT EXISTS FOR (e:Entity) ON (e.type);
          CREATE INDEX entity_name IF NOT EXISTS FOR (e:Entity) ON (e.name);
        " || echo "Neo4j seed failed — will retry via migration script"

    # ── openclaw-facts MCP plugin (Neo4j wrapper) ──
    # Exposes fact_add / fact_query / entity_timeline / entity_list tools.
    # Agents use these instead of re-reading STRATEGY.md on every task.
    - mkdir -p /home/openclaw/.openclaw/extensions/openclaw-facts/dist
    - |
        cat > /home/openclaw/.openclaw/extensions/openclaw-facts/package.json << 'PKGEOF'
        {
          "name": "openclaw-facts",
          "version": "0.1.0",
          "description": "Temporal knowledge graph for marketing facts (Neo4j)",
          "main": "dist/index.js",
          "dependencies": { "neo4j-driver": "^5.28.0" },
          "openclaw": { "displayName": "Marketing Facts Graph", "category": "memory", "requires": ["neo4j"] }
        }
        PKGEOF
    - |
        # Fetch plugin source from Production branch (single source of truth).
        # Falls back to embedded minimal version if fetch fails.
        PLUGIN_URL="https://raw.githubusercontent.com/synex-os/openclaw-hosting/Production/scripts/openclaw-facts-plugin.js"
        if ! curl -fsSL "$PLUGIN_URL" -o /home/openclaw/.openclaw/extensions/openclaw-facts/dist/index.js 2>/dev/null; then
          echo "Failed to fetch facts plugin from GitHub — skipping (migration script can install later)"
        fi
    - chown -R openclaw:openclaw /home/openclaw/.openclaw/extensions
    - |
        if [ -f /home/openclaw/.openclaw/extensions/openclaw-facts/dist/index.js ]; then
          su - openclaw -c 'cd /home/openclaw/.openclaw/extensions/openclaw-facts && npm install --omit=dev --silent 2>&1 | tail -5'
        fi
    # Register plugin in openclaw.json
    - |
        if [ -f /home/openclaw/.openclaw/extensions/openclaw-facts/dist/index.js ]; then
          systemctl stop openclaw-gateway 2>/dev/null
          python3 <<PYEOF
import json
p = '/home/openclaw/.openclaw/openclaw.json'
with open(p) as f: cfg = json.load(f)
plugins = cfg.setdefault('plugins', {})
entries = plugins.setdefault('entries', {})
entries['openclaw-facts'] = {
    'enabled': True,
    'source': { 'type': 'local', 'path': '/home/openclaw/.openclaw/extensions/openclaw-facts' },
    'config': {
        'uri':      'bolt://localhost:7687',
        'user':     'neo4j',
        'password': '{{AUTOMATION_PASSWORD}}'
    }
}
allow = plugins.setdefault('allow', [])
if 'openclaw-facts' not in allow: allow.append('openclaw-facts')
with open(p, 'w') as f: json.dump(cfg, f, indent=2)
print('openclaw-facts plugin registered')
PYEOF
          chown openclaw:openclaw /home/openclaw/.openclaw/openclaw.json
          systemctl start openclaw-gateway
        fi

    # ── LiteLLM AI Gateway ──
    - mkdir -p /opt/openclaw/data/litellm
    - |
        cat > /opt/openclaw/litellm-config.yaml << 'LLMEOF'
        model_list:
          - model_name: default
            litellm_params:
              model: anthropic/claude-sonnet-4-6
              api_key: os.environ/ANTHROPIC_API_KEY
          - model_name: default
            litellm_params:
              model: openai/gpt-4o
              api_key: os.environ/OPENAI_API_KEY
          - model_name: opus
            litellm_params:
              model: anthropic/claude-opus-4-6
              api_key: os.environ/ANTHROPIC_API_KEY
          - model_name: sonnet
            litellm_params:
              model: anthropic/claude-sonnet-4-6
              api_key: os.environ/ANTHROPIC_API_KEY
          - model_name: haiku
            litellm_params:
              model: anthropic/claude-haiku-4-5-20251001
              api_key: os.environ/ANTHROPIC_API_KEY
          - model_name: gpt4o
            litellm_params:
              model: openai/gpt-4o
              api_key: os.environ/OPENAI_API_KEY
          - model_name: gpt4o-mini
            litellm_params:
              model: openai/gpt-4o-mini
              api_key: os.environ/OPENAI_API_KEY
          - model_name: local
            litellm_params:
              model: ollama/llama3.1:8b
              api_base: http://host.docker.internal:11434

        litellm_settings:
          drop_params: true
          set_verbose: false
          request_timeout: 300
          num_retries: 2
          fallbacks:
            - default: [opus, sonnet, gpt4o]
          success_callback: []
          failure_callback: []

        general_settings:
          master_key: {{OPENCLAW_TOKEN}}
          database_url: null
        LLMEOF
    - |
        cat > /opt/openclaw/docker-compose.litellm.yml << 'LITEOF'
        services:
          litellm:
            image: ghcr.io/berriai/litellm:main-latest
            restart: unless-stopped
            ports: ["127.0.0.1:4000:4000"]
            volumes:
              - /opt/openclaw/litellm-config.yaml:/app/config.yaml
            command: ["--config", "/app/config.yaml", "--port", "4000"]
            extra_hosts: ["host.docker.internal:host-gateway"]
        LITEOF
    - cd /opt/openclaw && docker compose -f docker-compose.yml -f docker-compose.qdrant.yml -f docker-compose.litellm.yml up -d litellm

    # ── Nginx ──
    - |
        cat > /etc/nginx/sites-available/openclaw << 'NGEOF'
        server {
            listen 80;
            server_name {{SUBDOMAIN_NAME}}.clawflow.flowmatic.co.il;

            location / {
                proxy_pass http://127.0.0.1:3000;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 300s;
                proxy_hide_header X-Frame-Options;
                proxy_hide_header Content-Security-Policy;
            }

            location = /embed {
                proxy_pass http://127.0.0.1:3000/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 300s;
                proxy_hide_header X-Frame-Options;
                proxy_hide_header Content-Security-Policy;
            }

            location /embed/ {
                proxy_pass http://127.0.0.1:3000/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_read_timeout 300s;
                proxy_hide_header X-Frame-Options;
                proxy_hide_header Content-Security-Policy;
                sub_filter '</head>' '<style>.shell-nav,.shell-nav-backdrop,.agents-sidebar,.topnav-shell,.agent-header,.agents-toolbar,.agent-chat__toolbar,.agent-chat__toolbar-left,.agent-chat__toolbar-right,.chat-controls__model,.chat-controls__session,.chat-controls__session-row,.agent-model-select{display:none!important}.shell{grid-template-columns:1fr!important}</style></head>';
                sub_filter_once on;
                sub_filter_types text/html;
            }
        }
        server {
            listen 80;
            server_name {{SUBDOMAIN_NAME}}-flows.clawflow.flowmatic.co.il;

            # Block Platform Admin — customers don't need it
            location /platform {
                return 404;
            }

            # Dify API routes (only active when Dify is the automation tool)
            location /console/api {
                proxy_pass http://127.0.0.1:3100;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api {
                proxy_pass http://127.0.0.1:3100;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /v1 {
                proxy_pass http://127.0.0.1:3100;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /files {
                proxy_pass http://127.0.0.1:3100;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location / {
                proxy_pass http://127.0.0.1:{{AUTOMATION_PORT}};
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
        server {
            listen 80;
            server_name {{SUBDOMAIN_NAME}}-obs.clawflow.flowmatic.co.il;

            location / {
                proxy_pass http://127.0.0.1:3200;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
        NGEOF

    - ln -sf /etc/nginx/sites-available/openclaw /etc/nginx/sites-enabled/
    - rm -f /etc/nginx/sites-enabled/default
    - grep -q server_names_hash /etc/nginx/nginx.conf || sed -i '/http {/a\    server_names_hash_bucket_size 128;' /etc/nginx/nginx.conf
    - nginx -t && systemctl enable nginx && systemctl restart nginx

    # ── SSL ──
    - |
        for i in $(seq 1 30); do
          certbot --nginx \
            -d {{SUBDOMAIN_NAME}}.clawflow.flowmatic.co.il \
            -d {{SUBDOMAIN_NAME}}-flows.clawflow.flowmatic.co.il \
            -d {{SUBDOMAIN_NAME}}-obs.clawflow.flowmatic.co.il \
            --non-interactive --agree-tos \
            -m devops@flowmatic.co.il && break
          sleep 15
        done

    {{#HAS_BACKUP}}
    # ── Daily Backup ──
    - mkdir -p /opt/openclaw-backups
    - |
        cat > /opt/openclaw-backup.sh << 'BKEOF'
        #!/bin/bash
        BACKUP_DIR="/opt/openclaw-backups"
        TIMESTAMP=$(date +%Y%m%d-%H%M%S)
        BACKUP_FILE="$BACKUP_DIR/backup-$TIMESTAMP.tar.gz"
        INSTANCE_ID="{{INSTANCE_ID}}"
        API_URL="https://api.clawflow.flowmatic.co.il"

        # Create backup of openclaw data + automation configs
        tar -czf "$BACKUP_FILE" \
          -C /home/openclaw .openclaw \
          -C /opt/openclaw data 2>/dev/null

        # Keep only last 7 days
        find "$BACKUP_DIR" -name "backup-*.tar.gz" -mtime +7 -delete

        # Report to API
        BACKUP_SIZE=$(stat -c%s "$BACKUP_FILE" 2>/dev/null || echo "0")
        BACKUP_COUNT=$(ls -1 "$BACKUP_DIR"/backup-*.tar.gz 2>/dev/null | wc -l)
        curl -sf -X POST "$API_URL/hosting/instances/$INSTANCE_ID/backup-report" \
          -H "Content-Type: application/json" \
          -d "{\"timestamp\":\"$TIMESTAMP\",\"size\":$BACKUP_SIZE,\"count\":$BACKUP_COUNT}" > /dev/null || true
        BKEOF
    - chmod +x /opt/openclaw-backup.sh
    - echo "0 3 * * * root /opt/openclaw-backup.sh >> /var/log/openclaw-backup.log 2>&1" > /etc/cron.d/openclaw-backup
    # Run first backup immediately
    - /opt/openclaw-backup.sh &
    {{/HAS_BACKUP}}

    # ── Self-Healing Health Daemon ──
    # Script is deployed by provisioner via SSH after VPS is ready (not cloud-init)
    # This only sets up the systemd timer structure
    - |
        cat > /etc/systemd/system/clawflow-health.service << 'CHSEOF'
        [Unit]
        Description=ClawFlow Self-Healing Health Check
        After=openclaw-gateway.service docker.service
        [Service]
        Type=oneshot
        ExecStart=/opt/clawflow-health.sh
        TimeoutSec=120
        CHSEOF
        cat > /etc/systemd/system/clawflow-health.timer << 'CHTEOF'
        [Unit]
        Description=ClawFlow Health Check Timer (every 5 min)
        [Timer]
        OnBootSec=300
        OnUnitActiveSec=300
        [Install]
        WantedBy=timers.target
        CHTEOF
    - systemctl daemon-reload

    # ── OpenClaw auto-update (nightly 4am, silent) ──
    - |
        cat > /opt/openclaw-update.sh << 'UPDEOF'
        #!/bin/bash
        # Silent OpenClaw Gateway update
        CURRENT=$(su - openclaw -c 'openclaw --version 2>/dev/null' || echo "unknown")
        npm install -g @anthropic/openclaw@latest --silent 2>/dev/null
        NEW=$(su - openclaw -c 'openclaw --version 2>/dev/null' || echo "unknown")
        if [ "$CURRENT" != "$NEW" ]; then
          systemctl restart openclaw-gateway
          echo "$(date): Updated OpenClaw $CURRENT -> $NEW" >> /var/log/openclaw-update.log
        fi
        UPDEOF
        chmod +x /opt/openclaw-update.sh
    - echo "0 4 * * * root /opt/openclaw-update.sh >> /var/log/openclaw-update.log 2>&1" > /etc/cron.d/openclaw-update

    # Note: OpenClaw update banner cannot be disabled via config.
    # Auto-update cron (above) handles updates silently at 4am.

final_message: 'ClawFlow instance {{INSTANCE_ID}} ready!'
