server {
    server_name {{SUBDOMAIN_NAME}}.openclaw.flowmatic.co.il;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
    }

    location /embed/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        sub_filter '</body>' '<script>!function h(){var a=document.querySelector("openclaw-app");if(!a)return setTimeout(h,500);var r=a.shadowRoot||a;var c=document.createElement("style");c.textContent="nav,[class*=sidebar],[class*=Sidebar],aside{display:none!important}[class*=topbar],[class*=Topbar],[class*=top-bar],header,[class*=breadcrumb]{display:none!important}[class*=model-select],[class*=ModelSelect],[class*=session-bar],[class*=SessionBar],[class*=chat-header],[class*=ChatHeader]{display:none!important}[class*=layout]{margin:0!important;grid-template-columns:1fr!important;padding:0!important}";r.appendChild(c);var d=c.cloneNode(true);document.head.appendChild(d);r.querySelectorAll("nav,aside").forEach(function(x){x.style.display="none"})}()</script></body>';
        sub_filter_once on;
        sub_filter_types text/html;
    }

    location /embed/assets/ {
        proxy_pass http://127.0.0.1:3000/assets/;
        proxy_hide_header Content-Security-Policy;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/{{SUBDOMAIN_NAME}}.openclaw.flowmatic.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{SUBDOMAIN_NAME}}.openclaw.flowmatic.co.il/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name {{SUBDOMAIN_NAME}}-flows.openclaw.flowmatic.co.il;
    location /platform { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/{{SUBDOMAIN_NAME}}.openclaw.flowmatic.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{SUBDOMAIN_NAME}}.openclaw.flowmatic.co.il/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = {{SUBDOMAIN_NAME}}.openclaw.flowmatic.co.il) { return 301 https://$host$request_uri; }
    listen 80;
    server_name {{SUBDOMAIN_NAME}}.openclaw.flowmatic.co.il;
    return 404;
}

server {
    if ($host = {{SUBDOMAIN_NAME}}-flows.openclaw.flowmatic.co.il) { return 301 https://$host$request_uri; }
    listen 80;
    server_name {{SUBDOMAIN_NAME}}-flows.openclaw.flowmatic.co.il;
    return 404;
}
