# API and Web run via systemd (not Docker) — see /etc/systemd/system/openclaw-api.service
# Caddy runs natively via apt — see /etc/caddy/Caddyfile
# Only postgres and uptime-kuma remain in Docker.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
    environment:
      POSTGRES_DB: openclaw
      POSTGRES_USER: openclaw
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports: ["127.0.0.1:5432:5432"]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes: ["./data/kuma:/app/data"]
    ports: ["127.0.0.1:3002:3001"]
