app = 'clawhost-api'
primary_region = 'lax'

[build]

[http_service]
  internal_port = 2222
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[http_service.concurrency]
  type = 'requests'
  hard_limit = 250
  soft_limit = 200

[[http_service.checks]]
  interval = '5s'
  timeout = '3s'
  grace_period = '10s'
  method = 'GET'
  path = '/'

[deploy]
  strategy = 'immediate'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048