name: Release ClawNodeGo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag to checkout (defaults to current branch)'
        required: false
  push:
    tags:
      - 'clawnodego-v*'

env:
  VITE_API_URL: ${{ secrets.VITE_API_URL }}
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install
      - run: rm -rf out
        working-directory: apps/clawnodego
      - run: bun run package -- --platform darwin --arch arm64
        working-directory: apps/clawnodego
      - run: bash scripts/make-macos-artifacts.sh arm64
        working-directory: apps/clawnodego
      - run: bun run package -- --platform darwin --arch x64
        working-directory: apps/clawnodego
      - run: bash scripts/make-macos-artifacts.sh x64
        working-directory: apps/clawnodego
      - run: find out/make -type f
        working-directory: apps/clawnodego
      - uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: apps/clawnodego/out/make/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install
      - run: bun run build -- --platform win32 --arch x64
        working-directory: apps/clawnodego
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: apps/clawnodego/out/make/

  publish:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install
      - uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: apps/clawnodego/out/make/
      - uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: apps/clawnodego/out/make/
      - run: bun scripts/publish-r2.ts
        working-directory: apps/clawnodego
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}