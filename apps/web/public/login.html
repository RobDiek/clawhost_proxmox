<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>כניסה — ClawFlow</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232563EB'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui' font-weight='900' font-size='28' fill='white'>CF</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',system-ui,sans-serif;background:#FAFAFA;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.logo-block{text-align:center;margin-bottom:32px}
.logo-name{font-size:1.6rem;font-weight:800;color:#2563EB}
.logo-sub{font-size:0.75rem;color:#9CA3AF}
.card{background:#fff;border:1px solid #E5E7EB;border-radius:16px;padding:32px 28px;max-width:400px;width:100%}
.card-title{font-size:1.2rem;font-weight:700;color:#111827;text-align:center;margin-bottom:6px}
.card-desc{font-size:0.85rem;color:#6B7280;text-align:center;margin-bottom:24px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:0.85rem;font-weight:500;color:#374151;margin-bottom:6px}
.form-input{width:100%;padding:11px 14px;border:1px solid #E5E7EB;border-radius:8px;font-size:0.9rem;font-family:inherit;direction:ltr}
.form-input:focus{outline:none;border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:0.95rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-primary{background:#2563EB;color:#fff}
.btn-primary:hover{background:#1D4ED8}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.msg{font-size:0.82rem;margin-top:8px;min-height:20px}
.msg-error{color:#EF4444}
.msg-success{color:#10B981}
.hidden{display:none!important}
.link{display:block;text-align:center;margin-top:16px;font-size:0.82rem;color:#2563EB;text-decoration:none}
.link:hover{text-decoration:underline}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-inline-end:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="logo-block">
  <div class="logo-name">ClawFlow</div>
  <div class="logo-sub">by Flowmatic</div>
</div>

<div class="card">
  <div class="card-title">כניסה לחשבון</div>
  <div class="card-desc">הכניסו את האימייל שנרשמתם איתו</div>

  <div id="step-email">
    <div class="form-group">
      <label class="form-label" for="email">אימייל</label>
      <input class="form-input" id="email" type="email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <button class="btn btn-primary" id="btn-send" onclick="sendOtp()">שלחו קוד</button>
    <div class="msg" id="msg-email"></div>
  </div>

  <div id="step-otp" class="hidden">
    <div class="card-desc" id="otp-desc"></div>
    <div class="form-group">
      <label class="form-label" for="otp">קוד אימות</label>
      <input class="form-input" id="otp" type="text" placeholder="123456" maxlength="6" autocomplete="one-time-code"/>
    </div>
    <button class="btn btn-primary" id="btn-verify" onclick="verifyOtp()">אימות</button>
    <div class="msg" id="msg-otp"></div>
  </div>

  <div id="step-2fa" class="hidden">
    <div class="card-title" style="margin-bottom:8px">אימות דו-שלבי</div>
    <div class="card-desc">הכניסו את הקוד מאפליקציית ה-Authenticator</div>
    <div class="form-group">
      <label class="form-label" for="totp-code">קוד 2FA</label>
      <input class="form-input" id="totp-code" type="text" placeholder="000000" maxlength="6" autocomplete="one-time-code" style="text-align:center;letter-spacing:6px;font-size:1.2rem"/>
    </div>
    <button class="btn btn-primary" id="btn-2fa" onclick="verify2fa()">אישור</button>
    <div class="msg" id="msg-2fa"></div>
  </div>

  <a href="/" class="link">← חזרה לדף הראשי</a>
</div>

<script>
var API = 'https://api.clawflow.flowmatic.co.il';
var userEmail = '';
var partialToken = '';

function showMsg(id, text, isError) {
  var el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + (isError ? 'msg-error' : 'msg-success');
}

function setLoading(btnId, loading) {
  var btn = document.getElementById(btnId);
  if (loading) {
    btn.disabled = true;
    btn._orig = btn.textContent;
    btn.innerHTML = '<span class="spinner"></span>רגע...';
  } else {
    btn.disabled = false;
    btn.textContent = btn._orig || btn.textContent;
  }
}

async function sendOtp() {
  var email = document.getElementById('email').value.trim();
  if (!email) { showMsg('msg-email', 'הכניסו אימייל', true); return; }

  setLoading('btn-send', true);
  showMsg('msg-email', '', false);

  try {
    var res = await fetch(API + '/hosting/auth/send-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    });
    var data = await res.json();

    if (data.success) {
      userEmail = email;
      document.getElementById('step-email').classList.add('hidden');
      document.getElementById('step-otp').classList.remove('hidden');
      document.getElementById('otp-desc').textContent = 'שלחנו קוד אימות ל-' + email;
      document.getElementById('otp').focus();
    } else {
      showMsg('msg-email', data.message || 'שגיאה בשליחת הקוד', true);
    }
  } catch (e) {
    showMsg('msg-email', 'שגיאת תקשורת, נסו שוב', true);
  }
  setLoading('btn-send', false);
}

async function verifyOtp() {
  var code = document.getElementById('otp').value.trim();
  if (!code || code.length !== 6) { showMsg('msg-otp', 'הכניסו קוד בן 6 ספרות', true); return; }

  setLoading('btn-verify', true);
  showMsg('msg-otp', '', false);

  try {
    var res = await fetch(API + '/hosting/auth/verify-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: userEmail, code: code, mode: 'login' })
    });
    var data = await res.json();

    if (data.success && data.data && data.data.needs2fa) {
      // 2FA required — show TOTP step
      partialToken = data.data.partialToken;
      document.getElementById('step-otp').classList.add('hidden');
      document.getElementById('step-2fa').classList.remove('hidden');
      document.getElementById('totp-code').focus();
    } else if (data.success && data.data && data.data.token) {
      localStorage.setItem('cf_token', data.data.token);
      localStorage.setItem('cf_email', data.data.email);
      window.location.href = '/dashboard';
    } else if (data.message === 'no_account') {
      showMsg('msg-otp', '', false);
      document.getElementById('step-otp').innerHTML = '<div style="text-align:center;padding:12px 0"><div style="font-size:1.1rem;font-weight:600;color:#111827;margin-bottom:8px">אין חשבון עם האימייל הזה</div><div style="font-size:0.85rem;color:#6B7280;margin-bottom:16px">כדי להירשם, חזרו לדף הראשי ובחרו את הסוכנים שלכם.</div><a href="/" style="display:inline-block;padding:10px 24px;background:#2563EB;color:#fff;border-radius:8px;text-decoration:none;font-size:0.9rem;font-weight:600">לדף הראשי →</a></div>';
    } else {
      showMsg('msg-otp', data.message || 'קוד לא תקין', true);
    }
  } catch (e) {
    showMsg('msg-otp', 'שגיאת תקשורת, נסו שוב', true);
  }
  setLoading('btn-verify', false);
}

async function verify2fa() {
  var code = document.getElementById('totp-code').value.trim();
  if (!code || code.length !== 6) { showMsg('msg-2fa', 'הכניסו קוד בן 6 ספרות', true); return; }

  setLoading('btn-2fa', true);
  showMsg('msg-2fa', '', false);

  try {
    var res = await fetch(API + '/hosting/auth/2fa/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ partialToken: partialToken, code: code })
    });
    var data = await res.json();

    if (data.success && data.data && data.data.token) {
      localStorage.setItem('cf_token', data.data.token);
      localStorage.setItem('cf_email', data.data.email);
      window.location.href = '/dashboard';
    } else {
      showMsg('msg-2fa', data.message || 'קוד שגוי', true);
    }
  } catch (e) {
    showMsg('msg-2fa', 'שגיאת תקשורת, נסו שוב', true);
  }
  setLoading('btn-2fa', false);
}

document.getElementById('email').addEventListener('keydown', function(e) { if (e.key === 'Enter') sendOtp(); });
document.getElementById('otp').addEventListener('keydown', function(e) { if (e.key === 'Enter') verifyOtp(); });
document.getElementById('totp-code').addEventListener('keydown', function(e) { if (e.key === 'Enter') verify2fa(); });

// If already logged in, go to dashboard
if (localStorage.getItem('cf_token')) {
  window.location.href = '/dashboard';
}
</script>
</body>
</html>
