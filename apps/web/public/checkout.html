<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>תשלום — Flowmatic</title>
<meta name="description" content="השלימו את התשלום ל-Flowmatic"/>
<link rel="icon" href="/favicon.ico?v=cf2"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=cf2"/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<!-- AllPay Hosted Fields SDK — embeds PCI-compliant card fields inside our page -->
<script src="https://allpay.to/js/allpay-hf.js"></script>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Heebo', system-ui, sans-serif;
}
:root {
  --primary: #2563EB;
  --primary-dark: #1D4ED8;
  --primary-light: #EFF6FF;
  --bg: #FAFAFA;
  --surface: #FFFFFF;
  --border: #E5E7EB;
  --border-light: #D1D5DB;
  --text: #111827;
  --text-2: #4B5563;
  --text-3: #9CA3AF;
  --success: #10B981;
  --danger: #EF4444;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08);
}
html { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  font-size: 15px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 24px;
  -webkit-font-smoothing: antialiased;
}
a { text-decoration: none; color: var(--primary); }
a:hover { text-decoration: underline; }

/* ── Logo ── */
.logo-block {
  text-align: center;
  margin-bottom: 28px;
}
.logo-name {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.02em;
}
.logo-name span { color: var(--primary); }
.logo-sub {
  font-size: 0.72rem;
  color: var(--text-3);
  margin-top: 2px;
}

/* ── Card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  padding: 28px 24px;
  width: 100%;
  max-width: 480px;
  margin-bottom: 16px;
}
.card-title {
  font-size: 1.15rem;
  font-weight: 700;
  margin-bottom: 20px;
}

/* ── Summary ── */
.summary-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  font-size: 0.88rem;
  color: var(--text-2);
}
.summary-row + .summary-row {
  border-top: 1px solid var(--border);
}
.summary-row .label { flex: 1; }
.summary-row .value { font-weight: 600; color: var(--text); }
.summary-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0 0;
  margin-top: 8px;
  border-top: 2px solid var(--text);
  font-size: 1.05rem;
  font-weight: 700;
}
.summary-total .value { color: var(--primary); font-size: 1.15rem; }

/* ── Components list ── */
.component-list {
  list-style: none;
  padding: 0;
  margin: 0 0 12px;
}
.component-list li {
  font-size: 0.82rem;
  color: var(--text-2);
  padding: 4px 0;
  display: flex;
  align-items: center;
  gap: 6px;
}
.component-list li::before {
  content: '✓';
  color: var(--success);
  font-weight: 700;
  font-size: 0.75rem;
}

/* ── Form ── */
.form-group { margin-bottom: 14px; }
.form-label {
  display: block;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 5px;
}
.form-input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.92rem;
  font-family: inherit;
  background: var(--surface);
  color: var(--text);
  transition: border-color .15s;
  outline: none;
}
.form-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.form-input::placeholder { color: var(--text-3); }
.form-input:disabled {
  background: var(--bg);
  color: var(--text-3);
}

/* ── Button ── */
.btn {
  width: 100%;
  padding: 12px 20px;
  border: none;
  border-radius: var(--radius);
  font-size: 1rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: all .15s;
  margin-top: 8px;
}
.btn-primary {
  background: var(--primary);
  color: white;
}
.btn-primary:hover { background: var(--primary-dark); }
.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ── Messages ── */
.msg {
  font-size: 0.82rem;
  text-align: center;
  margin-top: 10px;
  min-height: 20px;
}
.msg-error { color: var(--danger); }

/* ── Secure badge ── */
.secure-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 0.75rem;
  color: var(--text-3);
  margin-top: 16px;
}
.secure-badge svg { width: 14px; height: 14px; fill: var(--text-3); }

/* ── Spinner ── */
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin .6s linear infinite;
  vertical-align: middle;
  margin-inline-end: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.hidden { display: none !important; }

/* ── Billing period toggle ── */
.billing-toggle {
  display: flex;
  gap: 6px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 18px;
}
.bt-opt {
  flex: 1;
  padding: 9px 8px;
  border: none;
  background: transparent;
  border-radius: 7px;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-2);
  cursor: pointer;
  transition: all .15s;
  line-height: 1.2;
}
.bt-opt .bt-save {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--success);
}
.bt-opt.active {
  background: var(--surface);
  color: var(--primary);
  box-shadow: var(--shadow);
}
</style>
</head>
<body>

<!-- Order Summary -->
<div class="card" style="margin-top:40px">
  <div style="text-align:center;margin-bottom:12px">
    <a href="/"><img src="/logo-flowmatic.png" alt="Flowmatic" style="height:32px"></a>
  </div>
  <div class="card-title">סיכום הזמנה</div>

  <div class="billing-toggle">
    <button type="button" class="bt-opt active" data-period="monthly" onclick="setBilling('monthly')">חודשי</button>
    <button type="button" class="bt-opt" data-period="annual" onclick="setBilling('annual')">שנתי <span class="bt-save">· חוסכים 18%</span></button>
  </div>

  <ul class="component-list" id="component-list"></ul>

  <div id="summary-rows"></div>

  <div class="summary-total">
    <span id="total-label">סה״כ לחודש</span>
    <span class="value" id="total-price"></span>
  </div>
</div>

<!-- Step 1: Customer details -->
<div class="card" id="customer-card">
  <div class="card-title">פרטי לקוח</div>

  <div class="form-group">
    <label class="form-label" for="cust-email">אימייל</label>
    <input class="form-input" id="cust-email" type="email" disabled dir="ltr" style="text-align:right"/>
  </div>

  <div class="form-group">
    <label class="form-label" for="cust-name">שם מלא</label>
    <input class="form-input" id="cust-name" type="text" placeholder="ישראל ישראלי" autocomplete="name"/>
  </div>

  <input type="hidden" id="cust-phone" value=""/>


  <button class="btn btn-primary" id="btn-continue" onclick="handleCheckout()">המשך לתשלום →</button>
  <div class="msg" id="msg-checkout"></div>

  <div class="secure-badge">
    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
    תשלום מאובטח דרך AllPay · פרטי האשראי לא עוברים דרך השרת שלנו
  </div>
</div>

<!-- Step 2: Card entry (AllPay Hosted Fields iframe — shown after payment is created) -->
<div class="card hidden" id="payment-card">
  <div class="card-title">פרטי תשלום</div>
  <p style="font-size:0.82rem;color:var(--text-2);margin-bottom:14px">הזינו את פרטי כרטיס האשראי. השדות מאובטחים ומנוהלים ישירות על ידי AllPay.</p>
  <iframe id="allpay-hf" allow="payment *" style="width:100%;border:none;min-height:360px;display:block"></iframe>
  <button class="btn btn-primary" id="btn-pay" onclick="doPay()">שלם <span id="pay-amount"></span> →</button>
  <div class="msg" id="msg-pay"></div>
  <a href="#" onclick="backToDetails(); return false;" style="display:block;text-align:center;font-size:0.8rem;margin-top:12px;color:var(--text-3)">← חזרה לפרטים</a>
</div>

<script>
const API = 'https://api.clawflow.flowmatic.co.il';

// Single self-serve plan (June 2026): flat ₪279/mo, includes 1 Mateh agent.
const SELF_SERVE_PRICE = 279;
const SELF_SERVE_LABEL = 'שירות עצמי';

// AllPay Hosted Fields — embed card fields in our page instead of redirecting.
// REQUIRES one-time AllPay dashboard setup: Settings → Integrations → My Sites
// → enable "Hosted Fields" + whitelist the domain app.flowmatic.co.il.
// Until that's done, AllPay's payment page refuses to load in an iframe
// (X-Frame-Options), so keep this false → falls back to full-page redirect.
// Flip to true once the dashboard config is confirmed.
const HOSTED_FIELDS = true;

const COMPONENT_NAMES = {
  oc: 'OpenClaw Personal',
  mt: 'MATEH — סוכן שיווק',
  ap: 'Activepieces',
  ok: 'מפתחות API',
  ol: 'Ollama',
  bk: 'גיבוי יומי',
  xs: 'אחסון נוסף'
};

// Check auth
const token = localStorage.getItem('cf_token');
const email = localStorage.getItem('cf_email');
if (!token) {
  window.location.href = '/register?' + window.location.search.slice(1);
}

// Parse URL params
const params = new URLSearchParams(window.location.search);
const planKey = 'self_serve';
let components = (params.get('components') || '').split(',').filter(Boolean);
if (!components.length) components = ['mt'];  // self-serve = 1 Mateh marketing agent
const storageGb = parseInt(params.get('storage') || '0', 10);
let billingPeriod = params.get('billing') || 'monthly';
const subdomainName = params.get('subdomain') || '';

// Show subdomain if available
if (subdomainName) {
  const addrEl = document.getElementById('address-display');
  if (addrEl) addrEl.textContent = subdomainName + '.flowmatic.co.il';
}

// Render components list
const listEl = document.getElementById('component-list');
components.forEach(function(comp) {
  const name = COMPONENT_NAMES[comp] || comp;
  const li = document.createElement('li');
  li.textContent = name;
  listEl.appendChild(li);
});

// Render summary rows
const rowsEl = document.getElementById('summary-rows');

function addRow(label, value) {
  const div = document.createElement('div');
  div.className = 'summary-row';
  div.innerHTML = '<span class="label">' + label + '</span><span class="value">' + value + '</span>';
  rowsEl.appendChild(div);
}

function storageMonthlyBase() {
  if (storageGb <= 0) return 0;
  return storageGb <= 20 ? 9 : storageGb <= 100 ? 39 : 199;
}

// Globals updated by renderSummary(); used by the payment step.
var isAnnual = false;
var monthlyTotal = 0;   // effective ₪/month (after annual discount)
var chargeAmount = 0;   // what we actually charge now: month=monthlyTotal, year=×12

function renderSummary() {
  isAnnual = billingPeriod === 'annual';
  var discount = isAnnual ? 0.82 : 1;  // 18% off for annual

  rowsEl.innerHTML = '';

  var planPrice = Math.round(SELF_SERVE_PRICE * discount);
  addRow('תוכנית ' + SELF_SERVE_LABEL, '₪' + planPrice + '/חודש');

  var storageMonthly = 0;
  if (storageGb > 0) {
    storageMonthly = Math.round(storageMonthlyBase() * discount);
    addRow('אחסון נוסף +' + storageGb + 'GB', '₪' + storageMonthly + '/חודש');
  }
  var backupMonthly = 0;
  if (components.includes('bk')) {
    backupMonthly = Math.round(19 * discount);
    addRow('גיבוי יומי', '₪' + backupMonthly + '/חודש');
  }

  monthlyTotal = planPrice + storageMonthly + backupMonthly;

  var totalEl = document.getElementById('total-price');
  var labelEl = document.getElementById('total-label');
  if (isAnnual) {
    var yearlyTotal = monthlyTotal * 12;
    chargeAmount = yearlyTotal;
    var savedPerYear = Math.round((SELF_SERVE_PRICE + storageMonthlyBase() + (components.includes('bk') ? 19 : 0)) * 12 * 0.18);
    if (labelEl) labelEl.textContent = 'סה״כ לשנה';
    totalEl.innerHTML = '₪' + yearlyTotal +
      '<div style="font-size:0.8rem;color:#10B981;margin-top:4px;font-weight:600">≈ ₪' + monthlyTotal + '/חודש · חוסכים ₪' + savedPerYear + ' (18%)</div>' +
      '<div style="font-size:0.72rem;color:var(--text-3);margin-top:3px;font-weight:400">ניתן לפצל עד 12 תשלומים</div>';
  } else {
    chargeAmount = monthlyTotal;
    if (labelEl) labelEl.textContent = 'סה״כ לחודש';
    totalEl.textContent = '₪' + monthlyTotal + '/חודש';
  }

  // reflect active toggle + keep the pay button amount in sync
  document.querySelectorAll('.bt-opt').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-period') === billingPeriod);
  });
  var payAmt = document.getElementById('pay-amount');
  if (payAmt) payAmt.textContent = '₪' + chargeAmount;
}

function setBilling(period) {
  billingPeriod = period;
  renderSummary();
}

renderSummary();

// Fill email
document.getElementById('cust-email').value = email || '';

function showMsg(text, isError) {
  var el = document.getElementById('msg-checkout');
  el.textContent = text;
  el.className = 'msg ' + (isError ? 'msg-error' : '');
}

function showPayMsg(text, isError) {
  var el = document.getElementById('msg-pay');
  el.textContent = text;
  el.className = 'msg ' + (isError ? 'msg-error' : '');
}

var instanceId = '';     // set after checkout, used by onSuccess redirect
var Allpay = null;       // AllPay Hosted Fields handler instance

// Step 1 → create the AllPay payment (subscription) on our server, then either
// embed the Hosted Fields iframe (real AllPay url) or redirect (test-mode bypass).
async function handleCheckout() {
  var name = document.getElementById('cust-name').value.trim();
  var phone = document.getElementById('cust-phone').value.trim();

  if (!name) { showMsg('הכניסו שם מלא', true); return; }

  var btn = document.getElementById('btn-continue');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>מעבד...';
  showMsg('', false);

  var automationTool = 'activepieces';

  // Build addons list
  var addons = [];
  if (components.includes('bk')) addons.push('backup');
  if (storageGb === 20) addons.push('storage_20');
  else if (storageGb === 100) addons.push('storage_100');
  else if (storageGb === 500) addons.push('storage_500');

  function resetContinue() {
    btn.disabled = false;
    btn.innerHTML = 'המשך לתשלום →';
  }

  try {
    var res = await fetch(API + '/hosting/checkout', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + token
      },
      body: JSON.stringify({
        components: components,
        automationTool: automationTool,
        addons: addons,
        customerEmail: email,
        customerName: name,
        customerPhone: phone,
        subdomainName: subdomainName || undefined,
        billingPeriod: billingPeriod
      })
    });

    var data = await res.json();

    if (!res.ok) {
      showMsg(data.message || 'שגיאה ביצירת התשלום', true);
      resetContinue();
      return;
    }

    // Save instance data for dashboard
    if (data.data) {
      instanceId = data.data.instanceId || '';
      localStorage.setItem('cf_instance_id', instanceId);
      localStorage.setItem('cf_instance_plan', planKey);
      localStorage.setItem('cf_instance_components', JSON.stringify(components));
      localStorage.setItem('cf_instance_subdomain', subdomainName || '');
      localStorage.setItem('cf_user_name', name);

      // Activate referral if ref code exists
      var refCode = localStorage.getItem('cf_ref');
      if (refCode && instanceId) {
        fetch(API + '/hosting/referral/activate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ referralCode: refCode, instanceId: instanceId })
        }).then(function() {
          localStorage.removeItem('cf_ref'); // clear used code
        }).catch(function() {}); // non-blocking
      }
    }

    // Track checkout initiation
    if (window.plausible) plausible('Checkout Started', {props: {plan: planKey, billing: billingPeriod}, revenue: {currency: 'ILS', amount: chargeAmount}});

    var url = data.data && (data.data.paymentUrl || data.data.url);
    if (!url) {
      showMsg('לא התקבל קישור לתשלום', true);
      resetContinue();
      return;
    }

    // Real AllPay payment url → embed Hosted Fields (when enabled). Otherwise
    // (flag off, or test-mode bypass returns an onboarding url) → full-page
    // redirect, as before.
    if (HOSTED_FIELDS && /allpay\.(to|co\.il)/i.test(url)) {
      startHostedFields(url);
    } else {
      window.location.href = url;
    }
  } catch (err) {
    showMsg('שגיאת תקשורת, נסו שוב', true);
    resetContinue();
  }
}

// Step 2 → swap the customer card for the AllPay Hosted Fields iframe.
function startHostedFields(url) {
  document.getElementById('customer-card').classList.add('hidden');
  var pc = document.getElementById('payment-card');
  pc.classList.remove('hidden');
  document.getElementById('pay-amount').textContent = '₪' + chargeAmount;

  var iframe = document.getElementById('allpay-hf');
  iframe.src = url;

  try {
    Allpay = new AllpayPayment({
      iframeId: 'allpay-hf',
      onSuccess: function () {
        window.location.href = '/onboarding?instance=' + encodeURIComponent(instanceId);
      },
      onError: function (errNum, errMsg) {
        showPayMsg('התשלום נכשל: ' + (errMsg || ('שגיאה ' + errNum)), true);
        var b = document.getElementById('btn-pay');
        b.disabled = false;
        b.innerHTML = 'שלם ₪' + chargeAmount + ' →';
      }
    });
  } catch (e) {
    // SDK blocked/unavailable → fall back to full-page redirect to AllPay
    window.location.href = url;
    return;
  }

  pc.scrollIntoView({ behavior: 'smooth' });
}

function doPay() {
  if (!Allpay) { showPayMsg('הטופס עדיין נטען, נסו שוב בעוד רגע', true); return; }
  var b = document.getElementById('btn-pay');
  b.disabled = true;
  b.innerHTML = '<span class="spinner"></span>מעבד תשלום...';
  showPayMsg('', false);
  try {
    Allpay.pay();
  } catch (e) {
    showPayMsg('שגיאה בעיבוד התשלום, נסו שוב', true);
    b.disabled = false;
    b.innerHTML = 'שלם ₪' + monthlyTotal + ' →';
  }
}

function backToDetails() {
  document.getElementById('payment-card').classList.add('hidden');
  document.getElementById('customer-card').classList.remove('hidden');
  var btn = document.getElementById('btn-continue');
  btn.disabled = false;
  btn.innerHTML = 'המשך לתשלום →';
}

// Enter key on the name field submits step 1
document.getElementById('cust-name').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleCheckout();
});
</script>
<!-- Plausible Analytics -->
<script defer data-domain="flowmatic.co.il" src="https://plausible.io/js/script.js"></script>
<script>window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)};</script>
</body>
</html>
