<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>הרשמה — ClawFlow by Flowmatic</title>
<meta name="description" content="הירשמו ל-ClawFlow — פלטפורמת אירוח לסוכני AI"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%232563EB'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='system-ui' font-weight='900' font-size='28' fill='white'>CF</text></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Heebo', system-ui, sans-serif;
}
:root {
  --primary: #2563EB;
  --primary-dark: #1D4ED8;
  --primary-light: #EFF6FF;
  --bg: #FAFAFA;
  --surface: #FFFFFF;
  --border: #E5E7EB;
  --text: #111827;
  --text-2: #4B5563;
  --text-3: #9CA3AF;
  --success: #10B981;
  --danger: #EF4444;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08);
}
html { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  font-size: 15px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  -webkit-font-smoothing: antialiased;
}
a { text-decoration: none; color: var(--primary); }
a:hover { text-decoration: underline; }

/* ── Logo ── */
.logo-block {
  text-align: center;
  margin-bottom: 28px;
}
.logo-name {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.02em;
}
.logo-name span { color: var(--primary); }
.logo-sub {
  font-size: 0.72rem;
  color: var(--text-3);
  margin-top: 2px;
}

/* ── Card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
  padding: 32px 28px;
  width: 100%;
  max-width: 420px;
}
.card-title {
  font-size: 1.25rem;
  font-weight: 700;
  text-align: center;
  margin-bottom: 6px;
}
.card-desc {
  font-size: 0.85rem;
  color: var(--text-2);
  text-align: center;
  margin-bottom: 24px;
}

/* ── Plan badge ── */
.plan-badge {
  background: var(--primary-light);
  border: 1px solid #BFDBFE;
  border-radius: 8px;
  padding: 10px 14px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.85rem;
}
.plan-badge .plan-name { font-weight: 600; color: var(--primary); }
.plan-badge .plan-price { font-weight: 700; color: var(--text); }

/* ── Form ── */
.form-group { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 6px;
}
.form-input {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 0.95rem;
  font-family: inherit;
  background: var(--surface);
  color: var(--text);
  transition: border-color .15s;
  outline: none;
}
.form-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}
.form-input::placeholder { color: var(--text-3); }
.form-input.otp-input {
  text-align: center;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: 0.3em;
  direction: ltr;
}

/* ── Button ── */
.btn {
  width: 100%;
  padding: 11px 20px;
  border: none;
  border-radius: var(--radius);
  font-size: 0.95rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all .15s;
}
.btn-primary {
  background: var(--primary);
  color: white;
}
.btn-primary:hover { background: var(--primary-dark); }
.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ── Messages ── */
.msg {
  font-size: 0.82rem;
  text-align: center;
  margin-top: 10px;
  min-height: 20px;
}
.msg-error { color: var(--danger); }
.msg-success { color: var(--success); }

/* ── Footer text ── */
.footer-text {
  text-align: center;
  font-size: 0.8rem;
  color: var(--text-3);
  margin-top: 20px;
}

/* ── Spinner ── */
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin .6s linear infinite;
  vertical-align: middle;
  margin-inline-end: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Hidden ── */
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="card" style="margin-top:40px">
  <div style="text-align:center;margin-bottom:16px">
    <img src="/logo-clawflow.png" alt="ClawFlow" style="height:32px">
  </div>
  <div class="card-title" style="font-size:1.15rem">הירשמו ל-ClawFlow</div>
  <div class="card-desc">צרו חשבון כדי להפעיל את הסוכנים שלכם</div>

  <div id="plan-info" class="plan-badge hidden">
    <span class="plan-name" id="plan-name-display"></span>
    <span class="plan-price" id="plan-price-display"></span>
  </div>

  <!-- Step 1: Email + Subdomain -->
  <div id="step-email">
    <div class="form-group">
      <label class="form-label" for="subdomain">בחרו כתובת לסוכן שלכם</label>
      <div style="display:flex;align-items:center;gap:0;direction:ltr">
        <input class="form-input" id="subdomain" type="text" placeholder="your-name" dir="ltr" autocomplete="off" style="border-radius:8px 0 0 8px;border-left:none;flex:1" oninput="checkName()"/>
        <span style="background:#F3F4F6;border:1px solid #E5E7EB;padding:10px 8px;font-size:0.75rem;color:#9CA3AF;white-space:nowrap;border-radius:0 8px 8px 0">.clawflow.flowmatic.co.il</span>
      </div>
      <div class="msg" id="msg-subdomain" style="font-size:0.78rem;min-height:20px"></div>
    </div>
    <div class="form-group">
      <label class="form-label" for="email">אימייל</label>
      <input class="form-input" id="email" type="email" placeholder="you@example.com" dir="ltr" autocomplete="email"/>
    </div>
    <div style="margin:12px 0;display:flex;align-items:flex-start;gap:8px">
      <input type="checkbox" id="terms-accept" style="margin-top:4px;accent-color:#2563EB;flex-shrink:0;width:18px;height:18px"/>
      <label for="terms-accept" style="font-size:0.8rem;color:#6B7280;line-height:1.5;cursor:pointer">
        קראתי ואני מסכים/ה ל<a href="/terms.html" target="_blank" style="color:#2563EB">תנאי השימוש</a>,
        <a href="/privacy.html" target="_blank" style="color:#2563EB">מדיניות הפרטיות</a>
        ו<a href="/disclosure.html" target="_blank" style="color:#2563EB">גילוי הנאות</a>.
      </label>
    </div>
    <button class="btn btn-primary" id="btn-send" onclick="sendOtp()">התחילו ניסיון חינם →</button>
    <div class="msg" id="msg-email"></div>
  </div>

  <!-- Step 2: OTP -->
  <div id="step-otp" class="hidden">
    <div class="card-desc" id="otp-desc"></div>
    <div class="form-group">
      <label class="form-label" for="otp">קוד אימות</label>
      <input class="form-input otp-input" id="otp" type="text" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="000000" dir="ltr" autocomplete="one-time-code"/>
    </div>
    <button class="btn btn-primary" id="btn-verify" onclick="verifyOtp()">אימות</button>
    <div class="msg" id="msg-otp"></div>
    <div class="footer-text" style="margin-top:14px;">
      <a href="#" onclick="backToEmail(); return false;">שלחו קוד חדש</a>
    </div>
  </div>
</div>

<div class="footer-text">
  כבר יש לכם חשבון? <a href="#" onclick="document.getElementById('email').focus(); return false;">התחברו</a>
</div>

<script>
const API = 'https://api.clawflow.flowmatic.co.il';

// Save referral code from URL if present
const refCode = new URLSearchParams(window.location.search).get('ref');
if (refCode) localStorage.setItem('cf_ref', refCode);

const PLANS = {
  personal: { he: 'אישי', price: 79 },
  business: { he: 'עסקי', price: 169 },
  pro:      { he: 'פרו', price: 349 },
  developer:{ he: 'מפתח', price: 599 }
};

const ADDON_PRICES = { bk: 19, xs_20: 9, xs_100: 39, xs_500: 199 };

// Parse URL params
const params = new URLSearchParams(window.location.search);
const planKey = params.get('plan');
const components = (params.get('components') || '').split(',').filter(Boolean);
const storageGb = parseInt(params.get('storage') || '0', 10);

// Calculate total price with addons + billing period
const billingPeriod = params.get('billing') || 'monthly';
if (planKey && PLANS[planKey]) {
  const plan = PLANS[planKey];
  const discount = billingPeriod === 'annual' ? 0.82 : 1;
  let addonsTotal = 0;
  if (components.includes('bk')) addonsTotal += ADDON_PRICES.bk;
  if (storageGb === 20) addonsTotal += ADDON_PRICES.xs_20;
  else if (storageGb === 100) addonsTotal += ADDON_PRICES.xs_100;
  else if (storageGb === 500) addonsTotal += ADDON_PRICES.xs_500;
  const totalPrice = Math.round((plan.price + addonsTotal) * discount);
  const periodLabel = billingPeriod === 'annual' ? '/חודש (שנתי)' : '/חודש';

  document.getElementById('plan-name-display').textContent = 'תוכנית ' + plan.he;
  document.getElementById('plan-price-display').textContent = '₪' + totalPrice + periodLabel;
  document.getElementById('plan-info').classList.remove('hidden');
}

let userEmail = '';
let subdomainValid = false;
let checkTimeout = null;

async function checkName() {
  const input = document.getElementById('subdomain');
  const name = input.value.trim().toLowerCase();
  const msgEl = document.getElementById('msg-subdomain');

  if (!name) {
    msgEl.textContent = '';
    subdomainValid = false;
    return;
  }

  if (name.length < 3) {
    msgEl.textContent = 'לפחות 3 תווים';
    msgEl.className = 'msg msg-error';
    subdomainValid = false;
    return;
  }

  if (!/^[a-z][a-z0-9-]{2,19}$/.test(name)) {
    msgEl.textContent = 'אותיות קטנות באנגלית, מספרים ומקפים בלבד';
    msgEl.className = 'msg msg-error';
    subdomainValid = false;
    return;
  }

  clearTimeout(checkTimeout);
  checkTimeout = setTimeout(async () => {
    msgEl.textContent = 'בודק...';
    msgEl.className = 'msg';
    try {
      const res = await fetch(API + '/hosting/subdomain/check?name=' + encodeURIComponent(name));
      const data = await res.json();
      if (data.data?.available) {
        msgEl.textContent = '✓ ' + name + '.clawflow.flowmatic.co.il';
        msgEl.className = 'msg msg-success';
        subdomainValid = true;
      } else {
        msgEl.textContent = data.data?.reason === 'reserved' ? 'שם שמור' : 'השם תפוס, נסו אחר';
        msgEl.className = 'msg msg-error';
        subdomainValid = false;
      }
    } catch {
      msgEl.textContent = 'שגיאה בבדיקה';
      msgEl.className = 'msg msg-error';
      subdomainValid = false;
    }
  }, 500);
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (loading) {
    btn.disabled = true;
    btn._origText = btn.textContent;
    btn.innerHTML = '<span class="spinner"></span>רגע...';
  } else {
    btn.disabled = false;
    btn.textContent = btn._origText || btn.textContent;
  }
}

function showMsg(id, text, isError) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + (isError ? 'msg-error' : 'msg-success');
}

async function sendOtp() {
  const email = document.getElementById('email').value.trim();
  const subdomain = document.getElementById('subdomain').value.trim().toLowerCase();
  if (!subdomain || !subdomainValid) { showMsg('msg-email', 'בחרו כתובת זמינה לסוכן', true); return; }
  if (!email) { showMsg('msg-email', 'הכניסו כתובת אימייל', true); return; }
  if (!document.getElementById('terms-accept').checked) { showMsg('msg-email', 'יש לאשר את תנאי השימוש', true); return; }

  // Record acceptance timestamp
  window._termsAccepted = {
    email: email,
    timestamp: new Date().toISOString(),
    ip: '',
    userAgent: navigator.userAgent,
    documents: ['terms.html', 'privacy.html', 'disclosure.html'],
  };

  setLoading('btn-send', true);
  showMsg('msg-email', '', false);

  try {
    const res = await fetch(API + '/hosting/auth/send-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();

    if (!res.ok) {
      showMsg('msg-email', data.message || 'שגיאה בשליחת הקוד', true);
      setLoading('btn-send', false);
      return;
    }

    userEmail = email;
    document.getElementById('step-email').classList.add('hidden');
    document.getElementById('step-otp').classList.remove('hidden');
    document.getElementById('otp-desc').textContent = 'שלחנו קוד אימות ל-' + email;
    document.getElementById('otp').focus();
  } catch (err) {
    showMsg('msg-email', 'שגיאת תקשורת, נסו שוב', true);
  }
  setLoading('btn-send', false);
}

async function verifyOtp() {
  const code = document.getElementById('otp').value.trim();
  if (!code || code.length !== 6) { showMsg('msg-otp', 'הכניסו את הקוד בן 6 הספרות', true); return; }

  setLoading('btn-verify', true);
  showMsg('msg-otp', '', false);

  try {
    const res = await fetch(API + '/hosting/auth/verify-otp', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: userEmail, code })
    });
    const data = await res.json();

    if (!res.ok) {
      showMsg('msg-otp', data.message || 'קוד שגוי', true);
      setLoading('btn-verify', false);
      return;
    }

    // Save token
    localStorage.setItem('cf_token', data.data.token);
    localStorage.setItem('cf_email', data.data.email);

    // Send terms acceptance record to backend
    if (window._termsAccepted) {
      window._termsAccepted.userId = data.data.userId;
      fetch(API + '/hosting/auth/accept-terms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + data.data.token },
        body: JSON.stringify(window._termsAccepted)
      }).catch(function() {}); // non-blocking
    }

    // Track signup
    if (window.plausible) plausible('Signup Complete');

    // Redirect to checkout with same params
    const searchParams = new URLSearchParams(window.location.search);
    const subdomainVal = document.getElementById('subdomain').value.trim().toLowerCase();
    if (subdomainVal) searchParams.set('subdomain', subdomainVal);
    window.location.href = '/checkout?' + searchParams.toString();
  } catch (err) {
    showMsg('msg-otp', 'שגיאת תקשורת, נסו שוב', true);
  }
  setLoading('btn-verify', false);
}

function backToEmail() {
  document.getElementById('step-otp').classList.add('hidden');
  document.getElementById('step-email').classList.remove('hidden');
  showMsg('msg-otp', '', false);
  document.getElementById('otp').value = '';
}

// Enter key support
document.getElementById('email').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendOtp();
});
document.getElementById('otp').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') verifyOtp();
});
</script>
<!-- Plausible Analytics -->
<script defer data-domain="flowmatic.co.il" src="https://plausible.io/js/script.js"></script>
<script>window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)};</script>
</body>
</html>
