<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClawFlow Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310B981'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='monospace' font-weight='900' font-size='28' fill='white'%3E%E2%9A%99%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<style>
:root{
  --bg:#020617; --panel:#0F172A; --panel-2:#1E293B; --border:#1E293B; --border-h:#334155;
  --text:#F1F5F9; --text-2:#94A3B8; --text-3:#64748B; --text-4:#475569;
  --accent:#10B981; --accent-bg:rgba(16,185,129,0.1);
  --primary:#3B82F6; --primary-bg:rgba(59,130,246,0.1);
  --warning:#F59E0B; --warning-bg:rgba(245,158,11,0.1);
  --danger:#EF4444; --danger-bg:rgba(239,68,68,0.1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--text); font-size:14px;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#334155;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#475569}

/* ── Layout ── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{
  width:230px; background:var(--panel); border-right:1px solid var(--border);
  display:flex; flex-direction:column; flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;border-bottom:1px solid var(--border)}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:monospace;font-weight:900;color:#fff}
.brand-name{font-weight:700;font-size:0.92rem;letter-spacing:-0.2px}
.brand-sub{font-size:0.66rem;color:var(--text-3);letter-spacing:1.4px;text-transform:uppercase}
.nav{padding:14px 8px;flex:1;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;
  color:var(--text-2); font-size:0.87rem; cursor:pointer; user-select:none;
  transition:background 0.12s, color 0.12s; margin-bottom:2px;
}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item.active{background:var(--accent-bg);color:var(--accent)}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-section{font-size:0.66rem;color:var(--text-4);letter-spacing:1.4px;text-transform:uppercase;padding:14px 14px 6px;margin-top:8px}
.sidebar-foot{padding:12px 14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sidebar-foot .who{font-size:0.78rem;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sidebar-foot button{background:transparent;color:var(--text-3);font-size:0.78rem;border:none;cursor:pointer;padding:4px 8px;border-radius:6px}
.sidebar-foot button:hover{color:var(--danger);background:var(--danger-bg)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{
  display:flex;align-items:center;gap:10px;padding:12px 22px;
  border-bottom:1px solid var(--border); background:var(--panel); flex-shrink:0;
}
.topbar-title{font-size:1.05rem;font-weight:700;letter-spacing:-0.2px}
.topbar-search{
  flex:1;max-width:520px;margin-left:auto; position:relative;
}
.topbar-search input{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:7px 11px 7px 34px;color:var(--text);font-size:0.87rem;font-family:inherit;
}
.topbar-search input:focus{outline:none;border-color:var(--border-h)}
.topbar-search .kbd{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-family:monospace;font-size:0.7rem;color:var(--text-3);
  background:var(--panel-2);padding:2px 6px;border-radius:4px;border:1px solid var(--border);
}
.topbar-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);width:14px;height:14px}

.content{flex:1;overflow-y:auto;padding:20px 22px}

/* ── Cards / KPIs ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.kpi{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;
  position:relative; overflow:hidden;
}
.kpi-label{font-size:0.74rem;color:var(--text-3);letter-spacing:0.6px;text-transform:uppercase;margin-bottom:6px}
.kpi-val{font-size:1.7rem;font-weight:700;color:var(--text);letter-spacing:-0.5px;line-height:1.1}
.kpi-sub{font-size:0.78rem;color:var(--text-3);margin-top:4px}
.kpi-icon{position:absolute;top:12px;right:12px;color:var(--text-4);width:18px;height:18px}

.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 12px}
.section-title{font-size:1rem;font-weight:600}
.section-foot{font-size:0.78rem;color:var(--text-3)}

/* ── Tables ── */
.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:0.85rem}
thead{background:var(--bg)}
th{
  text-align:left;padding:10px 14px;font-weight:600;color:var(--text-3);
  font-size:0.74rem;letter-spacing:0.4px;text-transform:uppercase;border-bottom:1px solid var(--border);
}
td{padding:12px 14px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background 0.1s}
tbody tr:hover{background:var(--panel-2)}
.mono{font-family:'SF Mono',Consolas,monospace;font-size:0.78rem;color:var(--text-2)}
.cell-strong{color:var(--text);font-weight:500}

/* ── Status badges ── */
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:0.72rem;font-weight:600;
  padding:3px 9px;border-radius:999px;border:1px solid transparent;
}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}
.badge-running{color:#10B981;background:rgba(16,185,129,0.12);border-color:rgba(16,185,129,0.3)}
.badge-initializing{color:#F59E0B;background:rgba(245,158,11,0.12);border-color:rgba(245,158,11,0.3)}
.badge-provisioning{color:#F59E0B;background:rgba(245,158,11,0.12);border-color:rgba(245,158,11,0.3)}
.badge-suspended{color:#94A3B8;background:rgba(148,163,184,0.12);border-color:rgba(148,163,184,0.3)}
.badge-failed{color:#EF4444;background:rgba(239,68,68,0.12);border-color:rgba(239,68,68,0.3)}
.badge-terminated{color:#64748B;background:rgba(100,116,139,0.12);border-color:rgba(100,116,139,0.3)}
.badge-awaiting_payment{color:#F59E0B;background:rgba(245,158,11,0.12);border-color:rgba(245,158,11,0.3)}
.badge-paid{color:#10B981;background:rgba(16,185,129,0.12);border-color:rgba(16,185,129,0.3)}
.badge-pending{color:#F59E0B;background:rgba(245,158,11,0.12);border-color:rgba(245,158,11,0.3)}
.badge-refunded{color:#94A3B8;background:rgba(148,163,184,0.12);border-color:rgba(148,163,184,0.3)}
.badge-master{color:#FBBF24;background:rgba(251,191,36,0.14);border-color:rgba(251,191,36,0.4)}
.badge-master::before{background:#FBBF24}

/* ── Filters / search row ── */
.filters{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.filters input,.filters select{
  background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:7px 10px;color:var(--text);font-size:0.85rem;font-family:inherit;
}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--border-h)}

/* ── Buttons ── */
.btn{
  background:var(--panel-2);color:var(--text);font-size:0.83rem;font-weight:500;
  padding:7px 13px;border-radius:7px;border:1px solid var(--border);cursor:pointer;
  font-family:inherit;transition:all 0.12s;display:inline-flex;align-items:center;gap:6px;
}
.btn:hover:not(:disabled){background:var(--border-h);border-color:var(--text-4)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover:not(:disabled){background:#2563EB}
.btn-success{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-success:hover:not(:disabled){background:#059669}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){background:#DC2626}
.btn-warning{background:var(--warning);border-color:var(--warning);color:#0F172A}
.btn-sm{font-size:0.77rem;padding:5px 10px}

/* ── Slide-over panel ── */
.slideover-bg{
  position:fixed;inset:0;background:rgba(2,6,23,0.6);z-index:99;
  opacity:0;visibility:hidden;transition:opacity 0.18s, visibility 0.18s;
  backdrop-filter:blur(4px);
}
.slideover-bg.show{opacity:1;visibility:visible}
.slideover{
  position:fixed;top:0;right:0;bottom:0;width:580px;max-width:90vw;
  background:var(--panel);border-left:1px solid var(--border);z-index:100;
  transform:translateX(100%);transition:transform 0.22s ease;
  display:flex;flex-direction:column;
}
.slideover.show{transform:translateX(0)}
.slideover-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.slideover-title{font-size:1rem;font-weight:700}
.slideover-close{background:transparent;border:none;color:var(--text-3);font-size:1.2rem;cursor:pointer;padding:6px;border-radius:6px}
.slideover-close:hover{background:var(--panel-2);color:var(--text)}
.slideover-body{flex:1;overflow-y:auto;padding:18px 22px}
.detail-grid{display:grid;grid-template-columns:120px 1fr;gap:10px 14px;font-size:0.83rem}
.detail-key{color:var(--text-3)}
.detail-val{color:var(--text);word-break:break-all}
.detail-section{margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.detail-section-title{font-size:0.74rem;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-3);margin-bottom:10px}
.actions-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

/* ── Modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(2,6,23,0.7);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;width:100%;max-width:480px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,0.5)}
.modal h3{font-size:1.05rem;font-weight:700;margin-bottom:8px}
.modal p{font-size:0.86rem;color:var(--text-2);line-height:1.65;margin-bottom:14px}
.modal input,.modal textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:0.9rem;font-family:inherit;margin-bottom:10px}
.modal input:focus,.modal textarea:focus{outline:none;border-color:var(--accent)}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}

/* ── Terminal ── */
.terminal-wrap{background:#000;border-radius:8px;overflow:hidden;height:520px;border:1px solid var(--border)}

/* ── Loader ── */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 0.7s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:40px;text-align:center;color:var(--text-3);font-size:0.86rem}

/* ── Cmd+K ── */
.cmdk-bg{position:fixed;inset:0;background:rgba(2,6,23,0.6);z-index:300;display:none;align-items:flex-start;justify-content:center;padding:80px 20px 20px;backdrop-filter:blur(4px)}
.cmdk-bg.show{display:flex}
.cmdk{background:var(--panel);border:1px solid var(--border);border-radius:12px;width:100%;max-width:560px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.5)}
.cmdk input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);padding:14px 18px;color:var(--text);font-size:0.95rem;font-family:inherit;outline:none}
.cmdk-results{max-height:60vh;overflow-y:auto}
.cmdk-item{padding:10px 18px;cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.cmdk-item:hover,.cmdk-item.focus{background:var(--panel-2)}
.cmdk-item .small{font-size:0.76rem;color:var(--text-3)}

.toast{position:fixed;top:20px;right:20px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:0.84rem;color:var(--text);z-index:500;box-shadow:0 14px 40px rgba(0,0,0,0.4);transform:translateX(120%);transition:transform 0.22s ease}
.toast.show{transform:translateX(0)}
.toast.success{border-color:var(--accent);color:var(--accent)}
.toast.error{border-color:var(--danger);color:#FCA5A5}
</style>
</head>
<body>
<div class="app">
  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">⚙</div>
      <div>
        <div class="brand-name">ClawFlow</div>
        <div class="brand-sub">admin</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-item active" data-route="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        Dashboard
      </div>
      <div class="nav-item" data-route="clients">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>
        Clients
      </div>
      <div class="nav-item" data-route="revenue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Revenue
      </div>
      <div class="nav-item" data-route="health">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        Health
      </div>
      <div class="nav-item" data-route="releases">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
        Releases
      </div>
      <div class="nav-item" data-route="audit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Audit log
      </div>
    </nav>
    <div class="sidebar-foot">
      <div class="who" id="who-am-i">…</div>
      <button onclick="logout()" title="Sign out">⏻</button>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-title" id="page-title">Dashboard</div>
      <div class="topbar-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" placeholder="Search instances, emails…" autocomplete="off">
        <span class="kbd">⌘K</span>
      </div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>

<!-- ── Slide-over (instance details) ── -->
<div class="slideover-bg" id="slideover-bg" onclick="closeSlideover()"></div>
<aside class="slideover" id="slideover">
  <div class="slideover-head">
    <div class="slideover-title" id="slideover-title">Details</div>
    <button class="slideover-close" onclick="closeSlideover()">✕</button>
  </div>
  <div class="slideover-body" id="slideover-body"></div>
</aside>

<!-- ── Modal ── -->
<div class="modal-bg" id="modal-bg" onclick="closeModalBg(event)">
  <div class="modal" id="modal"></div>
</div>

<!-- ── Cmd+K ── -->
<div class="cmdk-bg" id="cmdk-bg" onclick="closeCmdk(event)">
  <div class="cmdk">
    <input id="cmdk-input" placeholder="Type instance id, email, or 'goto: dashboard'…" autocomplete="off">
    <div class="cmdk-results" id="cmdk-results"></div>
  </div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
// ClawFlow Admin SPA — single-file, vanilla JS, no framework
// ═══════════════════════════════════════════════════════════════════════════

var API = window.location.origin === 'https://admin.flowmatic.co.il'
  ? 'https://api.clawflow.flowmatic.co.il'
  : (window.location.protocol + '//api.clawflow.flowmatic.co.il');

var jwt = localStorage.getItem('admin_jwt');
if (!jwt) { window.location.href = '/login'; }

// ── API helper ─────────────────────────────────────────────────────────────
async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'Authorization': 'Bearer ' + jwt }, opts.headers || {});
  if (opts.body && !(opts.body instanceof FormData)) {
    opts.headers['Content-Type'] = 'application/json';
    if (typeof opts.body !== 'string') opts.body = JSON.stringify(opts.body);
  }
  var r = await fetch(API + path, opts);
  if (r.status === 401) { localStorage.removeItem('admin_jwt'); window.location.href = '/login'; return; }
  return await r.json();
}

function escapeHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtIls(n){return '₪' + Number(n||0).toLocaleString('en-IL')}
function fmtDate(s){if(!s)return '—';var d=new Date(s);return d.toLocaleString('en-IL',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function fmtAge(s){if(!s)return '—';var sec=(Date.now()-new Date(s).getTime())/1000;if(sec<60)return Math.floor(sec)+'s ago';if(sec<3600)return Math.floor(sec/60)+'m ago';if(sec<86400)return Math.floor(sec/3600)+'h ago';return Math.floor(sec/86400)+'d ago'}
function toast(msg, type){var el=document.getElementById('toast');el.textContent=msg;el.className='toast show '+(type||'');setTimeout(function(){el.className='toast '+(type||'')},3000)}

// ── Whoami ─────────────────────────────────────────────────────────────────
api('/admin/me').then(function(r){
  if (r && r.success) {
    document.getElementById('who-am-i').textContent = r.data.email;
  }
});

// ── Routing ────────────────────────────────────────────────────────────────
var routes = {
  dashboard: { title: 'Dashboard', render: renderDashboard },
  clients:   { title: 'Clients',   render: renderClients },
  revenue:   { title: 'Revenue',   render: renderRevenue },
  health:    { title: 'Health',    render: renderHealth },
  releases:  { title: 'Releases',  render: renderReleases },
  audit:     { title: 'Audit log', render: renderAudit },
};
var currentRoute = 'dashboard';
function navigate(route) {
  currentRoute = route;
  document.querySelectorAll('.nav-item').forEach(function(el){
    el.classList.toggle('active', el.dataset.route === route);
  });
  document.getElementById('page-title').textContent = routes[route].title;
  document.getElementById('content').innerHTML = '<div class="empty"><span class="spinner"></span>Loading…</div>';
  routes[route].render();
}
document.querySelectorAll('.nav-item').forEach(function(el){
  el.addEventListener('click', function(){ navigate(el.dataset.route) });
});

// ─── Dashboard ─────────────────────────────────────────────────────────────
async function renderDashboard() {
  var r = await api('/admin/dashboard');
  if (!r || !r.success) { document.getElementById('content').innerHTML = '<div class="empty">Failed to load.</div>'; return; }
  var k = r.data.kpi;
  var html = '<div class="kpi-grid">';
  html += kpiCard('Running', k.runningInstances, k.initializingInstances ? '+' + k.initializingInstances + ' initializing' : 'all stable');
  html += kpiCard('MRR', fmtIls(k.mrrIls), 'gross monthly');
  html += kpiCard('Hetzner cost', '€' + (k.hetznerEstCostEur || 0), 'estimated/mo');

      '<select id="cli-status" onchange="filterClients()">' +
        '<option value="">all statuses</option>' +
        '<option value="running">running</option>' +
        '<option value="initializing">initializing</option>' +
        '<option value="suspended">suspended</option>' +

function filterClients() {
  var q = (document.getElementById('cli-search').value || '').toLowerCase();
  var status = document.getElementById('cli-status').value;
  var rows = clientsCache.filter(function(r){
    if (status && r.instance.status !== status) return false;
    if (!q) return true;
    return (r.user?.email||'').toLowerCase().includes(q) ||
           (r.instance.id||'').toLowerCase().includes(q) ||
           (r.user?.name||'').toLowerCase().includes(q) ||
           (r.instance.subdomainName||'').toLowerCase().includes(q);
  });
  document.getElementById('cli-count').textContent = rows.length + ' clients';
  document.getElementById('cli-tbody').innerHTML = rows.map(function(r){
    var i = r.instance, u = r.user || {};
    var masterTag = i.isMaster ? '<span class="badge badge-master" style="margin-right:6px">★ master</span>' : '';
    return '<tr onclick="openClient(\''+escapeHtml(i.id)+'\')">' +
      '<td class="cell-strong">'+masterTag+escapeHtml(u.email||'—')+'</td>' +
      '<td class="mono">'+escapeHtml(i.id)+'</td>' +
      '<td>'+escapeHtml(i.planKey||'—')+'</td>' +
      '<td><span class="badge badge-'+escapeHtml(i.status||'pending')+'">'+escapeHtml(i.status||'?')+'</span></td>' +
      '<td>'+fmtAge(i.createdAt)+'</td>' +
      '<td class="mono">'+escapeHtml(i.subdomainName||'—')+'</td>' +
    '</tr>';
  }).join('') || '<tr><td colspan="6" class="empty">No matching clients</td></tr>';
}

async function loadVersionStatus(id) {
  var holder = document.getElementById('ver-' + id);

    var r = await api('/admin/clients/' + id + '/version-status');
    if (!r || !r.success) { holder.innerHTML = '<span style="color:var(--text-3)">Unavailable</span>'; return; }
    var d = r.data;
    var inst = d.installed || {};
    var latest = d.latest || {};
    if (d.upToDate) {
      holder.innerHTML = '<span class="badge badge-running">✓ up to date · v' + escapeHtml(inst.stackVersion||'?') + '</span>';
    } else {
      var drift = (d.componentDrift||[]).length;
      var pending = (d.pendingMigrations||[]).length;
      holder.innerHTML = '<span class="badge" style="background:rgba(251,191,36,0.14);color:#FBBF24;border-color:rgba(251,191,36,0.4)">🆕 update available</span>' +

function showAdminUpgradeProgress(id) {
  var holder = document.getElementById('ver-' + id);

  holder.innerHTML =
    '<div style="background:#0F172A;border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:6px">' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">' +
        '<div style="width:14px;height:14px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite"></div>' +
        '<strong style="font-size:0.86rem">Upgrading…</strong>' +
      '</div>' +
      '<div style="background:#1E293B;border-radius:6px;height:6px;overflow:hidden;margin-bottom:8px">' +
        '<div id="adm-up-bar-' + id + '" style="height:100%;background:linear-gradient(90deg,#3B82F6,#10B981);width:0%;transition:width .3s"></div>' +
      '</div>' +
      '<div id="adm-up-step-' + id + '" style="font-size:0.78rem;color:var(--text-3)">starting…</div>' +
    '</div>';

  window['_admUp_'+id] = setInterval(async function(){
    var r = await api('/admin/clients/' + id + '/upgrade-progress');
    if (!r || !r.success) return;
    var p = r.data;
    var bar = document.getElementById('adm-up-bar-' + id);
    var step = document.getElementById('adm-up-step-' + id);
    if (bar) bar.style.width = (p.pct||0) + '%';
    if (step) step.textContent = (p.step||'…') + ' · ' + (p.detail||'') + ' (' + (p.pct||0) + '%)';
    if (p.status === 'success') {
      clearInterval(window['_admUp_'+id]);
      toast('Upgrade complete ✓', 'success');
      setTimeout(function(){ loadVersionStatus(id) }, 1000);
    }
    if (p.status === 'failed' || p.status === 'rolled_back') {
      clearInterval(window['_admUp_'+id]);
      toast('Upgrade ' + p.status + ': ' + (p.error||''), 'error');
      if (step) step.style.color = '#FCA5A5';
    }
  }, 3000);
}

function openTerminal(id) {
  showModal('<h3>SSH · ' + escapeHtml(id) + '</h3>' +
    '<div id="term-host" class="terminal-wrap"></div>' +
    '<div class="modal-foot"><button class="btn" onclick="closeTerm()">Close</button></div>');
  setTimeout(function(){
    var term = new Terminal({ theme:{ background:'#000' }, fontFamily:'SF Mono, Consolas, monospace', fontSize:13, cursorBlink:true });
    var fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById('term-host'));
    fit.fit();
    var ws = new WebSocket('wss://api.clawflow.flowmatic.co.il/ws/admin/terminal/' + id + '?token=' + encodeURIComponent(jwt));
    ws.onopen = function(){ term.write('\r\n\x1b[32m· Connecting to ' + id + '…\x1b[0m\r\n'); };
    ws.onmessage = function(e){ term.write(e.data); };
    ws.onclose = function(){ term.write('\r\n\x1b[31m· Connection closed\x1b[0m\r\n'); };
    ws.onerror = function(){ term.write('\r\n\x1b[31m· Error\x1b[0m\r\n'); };
    term.onData(function(d){ if (ws.readyState === 1) ws.send(d); });
    term.onResize(function(s){ if (ws.readyState === 1) ws.send(JSON.stringify({type:'resize', cols:s.cols, rows:s.rows})); });
    window._adminTerm = { term: term, ws: ws, fit: fit };
    window.addEventListener('resize', function(){ try{fit.fit()}catch(_){}});
  }, 80);
}
function closeTerm() {
  if (window._adminTerm) {
    try { window._adminTerm.ws.close() } catch(_){}
    try { window._adminTerm.term.dispose() } catch(_){}
    window._adminTerm = null;
  }
  closeModal();
}

async function doRefund(id) {
  var confirmText = document.getElementById('rf-confirm').value.trim();
  var reason = document.getElementById('rf-reason').value.trim();
  if (confirmText !== id) return toast('Confirmation must match the Payment ID exactly', 'error');
  var r = await api('/admin/payments/' + id + '/refund', { method:'POST', body: { confirm: id, reason: reason } });
  if (r && r.success) { toast('Refunded', 'success'); closeModal(); navigate('revenue'); }
  else toast(r?.message || 'Failed', 'error');
}

// ─── Refund + terminate (atomic, instance-level) ───────────────────────────
function refundAndTerminateModal(id, email) {
  showModal(
    '<h3 style="color:#FCA5A5">Refund &amp; terminate ' + escapeHtml(id) + '</h3>' +
    '<p>This will:</p>' +
    '<ol style="font-size:0.86rem;color:var(--text-2);line-height:1.7;padding-left:18px;margin-bottom:14px">' +
      '<li>Refund <strong>all paid AllPay charges</strong> for this instance</li>' +
      '<li>Take a 7-day Hetzner snapshot (rollback insurance)</li>' +
      '<li>Delete the VPS</li>' +
      '<li>Delete Cloudflare DNS records</li>' +
      '<li>Mark instance as <code>terminated</code></li>' +
    '</ol>' +
    (email ? '<p style="font-size:0.82rem;color:var(--text-3)">Customer: <strong>' + escapeHtml(email) + '</strong></p>' : '') +
    '<label style="font-size:0.78rem;color:var(--text-2);display:block;margin-bottom:4px">Paste instance ID to confirm:</label>' +
    '<input id="rt-confirm" placeholder="' + escapeHtml(id) + '" autofocus>' +
    '<input id="rt-reason" placeholder="Reason (optional, goes to audit log)">' +
    '<div class="modal-foot">' +
      '<button class="btn" onclick="closeModal()">Cancel</button>' +
      '<button class="btn" onclick="document.getElementById(\'rt-confirm\').value=\''+id+'\'" style="background:rgba(251,191,36,0.14);color:#FBBF24">Auto-fill</button>' +
      '<button class="btn btn-danger" onclick="doRefundAndTerminate(\''+id+'\')">Refund &amp; terminate</button>' +
    '</div>'
  );
}
async function doRefundAndTerminate(id) {
  var confirmText = document.getElementById('rt-confirm').value.trim();
  var reason = document.getElementById('rt-reason').value.trim();
  if (confirmText !== id) return toast('Confirmation must equal the Instance ID', 'error');
  var r = await api('/admin/clients/' + id + '/refund-and-terminate', { method:'POST', body: { confirm: id, reason: reason } });
  if (r && r.success) {
    var n = (r.data.refunds || []).filter(function(x){return x.ok}).length;
    toast('Refunded ' + n + ' payments (₪' + (r.data.totalRefundedIls||0) + ') · VPS terminated', 'success');
    closeModal(); closeSlideover(); navigate('clients');
  } else toast(r?.message || 'Failed', 'error');
}

// ─── Health ────────────────────────────────────────────────────────────────
async function renderHealth() {
  var r = await api('/admin/clients?status=running');
  if (!r || !r.success) { document.getElementById('content').innerHTML = '<div class="empty">Failed</div>'; return; }
  var html = '<div class="kpi-grid">';
  r.data.clients.forEach(function(row){
    var i = row.instance;
    html += '<div class="kpi" onclick="openClient(\''+escapeHtml(i.id)+'\')" style="cursor:pointer">' +
      '<div class="kpi-label">'+escapeHtml(i.id)+'</div>' +
      '<div class="kpi-val" style="font-size:0.95rem;color:#10B981">'+escapeHtml(i.subdomainName||'—')+'</div>' +
      '<div class="kpi-sub"><span class="badge badge-'+escapeHtml(i.status)+'">'+escapeHtml(i.status)+'</span> · '+fmtAge(i.createdAt)+'</div>' +
    '</div>';
  });
  html += '</div>';
  if (!r.data.clients.length) html = '<div class="empty">No running instances</div>';
  document.getElementById('content').innerHTML = html;
}

// ─── Releases ──────────────────────────────────────────────────────────────
async function renderReleases() {
  var manifestRes = await fetch(API + '/hosting/version/manifest', { headers:{Authorization:'Bearer '+jwt} });
  var manifest = (await manifestRes.json()).data || {};
  var clientsRes = await api('/admin/clients?status=running');
  var running = (clientsRes && clientsRes.success) ? clientsRes.data.clients : [];
  var dashStatus = await api('/admin/dashboard-publish/status').catch(function(){return null});

  // Fetch version status for each running instance (in parallel, capped)
  var statuses = await Promise.all(running.map(async function(r){
    var s = await api('/admin/clients/' + r.instance.id + '/version-status').catch(function(){return null});
    return { row: r, status: s && s.success ? s.data : null };
  }));
  var outdated = statuses.filter(function(s){ return s.status && !s.status.upToDate });

  var html =
    '<div class="kpi-grid">' +
      kpiCard('Latest stack', escapeHtml(manifest.stackVersion||'?'), fmtDate(manifest.releasedAt)) +
      kpiCard('Running instances', running.length, 'on platform') +
      kpiCard('Outdated', outdated.length, outdated.length ? 'have drift' : 'all current', outdated.length ? 'danger' : '') +
    '</div>';

  // ── Dashboard staging → prod section ──
  // Devops pushes to dashboard-staging.html (master canary lands there).
  // Admin clicks Publish to copy staging → prod for all paying clients.
  if (dashStatus && dashStatus.success && dashStatus.data && dashStatus.data.files) {
    var dashFile = dashStatus.data.files[0] || {};
    var diverged = !dashFile.inSync;
    var stagingNewer = dashFile.stagingNewer;
    var fmtTime = function(iso){ try { return new Date(iso).toLocaleString('en-GB'); } catch(e){ return iso; } };
    html += '<div class="section-head"><div class="section-title">Dashboard publish — staging → prod</div></div>';
    html += '<div class="table-wrap" style="padding:14px 18px">' +
      '<div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">' +
        '<div style="flex:1;min-width:240px">' +
          '<div style="font-size:0.78rem;color:var(--text-3);margin-bottom:4px">Staging (master canary sees this)</div>' +
          '<div class="mono" style="font-size:0.78rem">' + escapeHtml(dashFile.stagingMd5||'').slice(0,12) + ' · ' + Math.round((dashFile.stagingSize||0)/1024) + ' KB</div>' +
          '<div style="font-size:0.74rem;color:var(--text-3);margin-top:2px">' + fmtTime(dashFile.stagingMtime) + '</div>' +
        '</div>' +
        '<div style="flex:1;min-width:240px">' +
          '<div style="font-size:0.78rem;color:var(--text-3);margin-bottom:4px">Prod (all paying clients see this)</div>' +
          '<div class="mono" style="font-size:0.78rem">' + escapeHtml(dashFile.prodMd5||'').slice(0,12) + ' · ' + Math.round((dashFile.prodSize||0)/1024) + ' KB</div>' +
          '<div style="font-size:0.74rem;color:var(--text-3);margin-top:2px">' + fmtTime(dashFile.prodMtime) + '</div>' +
        '</div>' +
        '<div style="flex-shrink:0;align-self:center">' +
          (diverged
            ? (stagingNewer
                ? '<button class="btn btn-success" onclick="adminPublishDashboard()">⬆ Publish staging → prod</button>'
                : '<button class="btn btn-danger" onclick="adminPublishDashboard()" title="prod is newer than staging — unusual">⚠ Publish anyway</button>')
            : '<span class="badge badge-running">✓ in sync</span>') +
        '</div>' +
      '</div>' +
      (diverged ? '<div style="margin-top:10px;padding:8px 12px;background:rgba(251,191,36,0.12);border:1px solid rgba(251,191,36,0.4);border-radius:6px;font-size:0.78rem;color:#FBBF24">⚠ Staging differs from prod. Test on master, then click Publish to deliver to all clients.</div>' : '') +
    '</div>';
  }

  html += '<div class="section-head">' +
    '<div class="section-title">Release notes — v' + escapeHtml(manifest.stackVersion||'?') + '</div>' +
    '<div class="section-foot">' +
      (outdated.length ? '<button class="btn btn-success" onclick="adminBulkUpgrade()">⬆ Push upgrade to all outdated (' + outdated.length + ')</button>' : '') +
    '</div></div>';
  if ((manifest.releaseNotes||[]).length) {
    html += '<div class="table-wrap" style="padding:14px 18px"><ul style="padding-left:20px;font-size:0.86rem;color:var(--text-2);line-height:1.8">' +
      manifest.releaseNotes.map(function(n){return '<li>'+escapeHtml(n)+'</li>'}).join('') +
      '</ul></div>';
  }

  html += '<div class="section-head"><div class="section-title">Per-instance status</div></div>';
  html += '<div class="table-wrap"><table><thead><tr><th>Email</th><th>Instance</th><th>Installed</th><th>Latest</th><th>Drift</th><th>Pending mig.</th><th></th></tr></thead><tbody>';
  statuses.forEach(function(s){
    var i = s.row.instance, u = s.row.user || {};
    var status = s.status || { installed:null, latest:null, componentDrift:[], pendingMigrations:[] };
    var inst = status.installed || {};
    var ok = status.upToDate;
    var masterTag = i.isMaster ? '<span class="badge badge-master" style="margin-right:6px">★</span>' : '';
    html += '<tr onclick="openClient(\''+escapeHtml(i.id)+'\')">' +
      '<td class="cell-strong">'+masterTag+escapeHtml(u.email||'—')+'</td>' +
      '<td class="mono">'+escapeHtml(i.id)+'</td>' +
      '<td class="mono">'+escapeHtml(inst.stackVersion||'(none)')+'</td>' +
      '<td class="mono">'+escapeHtml(manifest.stackVersion||'?')+'</td>' +
      '<td>'+(ok ? '<span class="badge badge-running">✓ current</span>' : '<span class="badge" style="background:rgba(251,191,36,0.14);color:#FBBF24;border-color:rgba(251,191,36,0.4)">'+(status.componentDrift||[]).length+' components</span>')+'</td>' +
      '<td>'+(status.pendingMigrations||[]).length+'</td>' +
      '<td>' + (ok ? '' : '<button class="btn btn-sm btn-success" onclick="event.stopPropagation();adminPushUpgrade(\''+escapeHtml(i.id)+'\')">⬆ Push</button>') + '</td>' +
    '</tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('content').innerHTML = html;
}

// ─── Audit ─────────────────────────────────────────────────────────────────
async function renderAudit() {
  var r = await api('/admin/audit?limit=300');
  if (!r || !r.success) { document.getElementById('content').innerHTML = '<div class="empty">Failed</div>'; return; }
  var html = '<div class="table-wrap"><table><thead><tr><th>When</th><th>Action</th><th>Target</th><th>IP</th><th>Details</th></tr></thead><tbody>';
  r.data.audit.forEach(function(a){
    html += '<tr>' +
      '<td>'+fmtDate(a.createdAt)+'</td>' +
      '<td class="cell-strong">'+escapeHtml(a.action)+'</td>' +
      '<td class="mono">'+(a.targetType?escapeHtml(a.targetType)+':':'')+escapeHtml(a.targetId||'—')+'</td>' +
      '<td class="mono">'+escapeHtml(a.ip||'—')+'</td>' +
      '<td class="mono" style="font-size:0.74rem">'+(a.details?escapeHtml(JSON.stringify(a.details)).slice(0,140):'')+'</td>' +
    '</tr>';
  });
  html += '</tbody></table></div>';
  document.getElementById('content').innerHTML = html;
}

// ─── Modal ─────────────────────────────────────────────────────────────────
function showModal(html) {
  document.getElementById('modal').innerHTML = html;
  document.getElementById('modal-bg').classList.add('show');
}
function closeModal() {
  document.getElementById('modal-bg').classList.remove('show');
}
function closeModalBg(e) { if (e.target.id === 'modal-bg') closeModal(); }

// ─── Cmd+K ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', function(e){
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openCmdk(); }
  if (e.key === 'Escape') { closeCmdk(); closeSlideover(); closeModal(); }
});
function openCmdk() {
  document.getElementById('cmdk-bg').classList.add('show');
  document.getElementById('cmdk-input').value = '';
  document.getElementById('cmdk-input').focus();
  cmdkUpdate('');
}
function closeCmdk(e) { if (!e || e.target.id === 'cmdk-bg') document.getElementById('cmdk-bg').classList.remove('show'); }
document.getElementById('cmdk-input').addEventListener('input', function(e){ cmdkUpdate(e.target.value) });
async function cmdkUpdate(q) {
  q = (q||'').trim().toLowerCase();
  var items = [];
  // Routes
  Object.keys(routes).forEach(function(rt){
    if (!q || rt.includes(q)) items.push({ type:'route', label: 'Go to · ' + routes[rt].title, route: rt });
  });
  // Cached clients
  if (clientsCache.length === 0 && q.length >= 2) {
    var r = await api('/admin/clients');
    if (r && r.success) clientsCache = r.data.clients;
  }
  clientsCache.forEach(function(c){
    var s = (c.user?.email||'') + ' ' + (c.instance.id||'') + ' ' + (c.instance.subdomainName||'');
    if (!q || s.toLowerCase().includes(q)) items.push({ type:'client', label: (c.user?.email||'?'), small: c.instance.id, id: c.instance.id });
  });
  document.getElementById('cmdk-results').innerHTML = items.slice(0, 12).map(function(it, idx){
    return '<div class="cmdk-item' + (idx===0?' focus':'') + '" onclick="cmdkActivate('+idx+')">' +
      '<div style="flex:1">'+escapeHtml(it.label)+(it.small?' <span class="small">'+escapeHtml(it.small)+'</span>':'')+'</div>' +
    '</div>';
  }).join('');
  window._cmdkItems = items.slice(0, 12);
}
function cmdkActivate(idx) {
  var it = (window._cmdkItems||[])[idx]; if (!it) return;
  closeCmdk();
  if (it.type === 'route') navigate(it.route);
  else if (it.type === 'client') { navigate('clients'); openClient(it.id); }
}
document.getElementById('cmdk-input').addEventListener('keydown', function(e){
  if (e.key === 'Enter') cmdkActivate(0);
});

// ─── Logout ────────────────────────────────────────────────────────────────
async function logout() {
  if (!confirm('Sign out?')) return;
  await api('/admin/logout', { method:'POST' });
  localStorage.removeItem('admin_jwt');
  window.location.href = '/login';
}

// Top search shortcut → Cmd+K
document.getElementById('search').addEventListener('focus', function(){ openCmdk() });

// Boot
navigate('dashboard');
</script>
